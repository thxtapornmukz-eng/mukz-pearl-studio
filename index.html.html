function copyFacebookLink(){const url='https://www.facebook.com/share/1BucWPzKeb/';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>toast('คัดลอกลิงก์ Facebook แล้ว 💗')).catch(()=>copyLinkFallback(url))}else copyLinkFallback(url)}

function applyTheme(){let t=themes[state.settings.theme]||themes.pink;let r=document.documentElement.style;r.setProperty('--bg',t.bg);r.setProperty('--card',t.card);r.setProperty('--accent',t.accent);r.setProperty('--accent-soft',t.soft);r.setProperty('--accent-deep',t.deep);}
function totals(){let savings=state.savings.reduce((a,x)=>a+num(x.amount),0), sales=state.sales.reduce((a,x)=>a+num(x.qty)*num(x.price),0), costs=state.costs.reduce((a,x)=>a+(x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount)),0), goalTarget=state.goals.reduce((a,x)=>a+num(x.target),0),goalSaved=state.goals.reduce((a,g)=>a+goalAmount(g.id),0),profit=sales-costs;return{savings,sales,costs,profit,goalTarget,goalSaved,salesPct:costs>0?sales/costs*100:null,costPct:costs>0?100:null,profitPct:costs>0?profit/costs*100:null,savingsPct:goalTarget>0?Math.min(100,goalSaved/goalTarget*100):0}}

function freshState(){return {goals:[],completedGoals:[],savings:[],investments:[],sales:[],costs:[],plans:[],settings:{theme:'pink',name:'พื้นที่การเงินของเรา',greeting:'สวัสดี 👋'}}}
function normalizeState(data={}){state={...freshState(),...data};state.settings={...freshState().settings,...(data.settings||{})};for(const k of ['goals','completedGoals','savings','investments','sales','costs','plans'])if(!Array.isArray(state[k]))state[k]=[];}
function persist(){applyTheme();if(!firebaseReady||!user){toast('กรุณาเข้าสู่ระบบก่อนบันทึกข้อมูล');return}clearTimeout(syncTimer);const uid=user.uid;const snapshot=JSON.parse(JSON.stringify(state));pendingSync=pendingSync.then(async()=>{try{const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');if(!user||user.uid!==uid)return;await setDoc(doc(db,'users',uid,'app','data'),snapshot)}catch(e){console.error('Firestore save failed',e);toast('บันทึกออนไลน์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต')}})}
function stat(label,value,foot,cls=''){let shown=typeof value==='string'?esc(value):money(value);return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${shown}</div><div class="stat-foot">${foot||''}</div></div>`}
function title(h,p,action=''){const extra=p===''?' greeting-title':'';return `<div class="page-title${extra}"><div><h2>${h}</h2>${p?`<p>${p}</p>`:''}</div>${action}</div>`}
function savingsAdvice(g,saved){if(!g.deadline)return '<div class="muted">เพิ่มวันครบเป้าหมายเพื่อคำนวณยอดออมเฉลี่ย ✨</div>';let todayDate=new Date(today()+'T00:00:00'),end=new Date(g.deadline+'T00:00:00');let days=Math.max(0,Math.ceil((end-todayDate)/86400000)),left=Math.max(0,num(g.target)-saved);if(left<=0)return '<div class="cheer">🎉 เป้าหมายสำเร็จแล้ววว! เก่งที่สุดเลยยย 💖</div>';let bits=[`<span>วันละ <b>${money(left/Math.max(1,days))}</b></span>`];if(days>7)bits.push(`<span>สัปดาห์ละ <b>${money(left/Math.max(1,days/7))}</b></span>`);if(days>30)bits.push(`<span>เดือนละ <b>${money(left/Math.max(1,days/30.4375))}</b></span>`);if(days>365)bits.push(`<span>ปีละ <b>${money(left/Math.max(1,days/365.25))}</b></span>`);return `<div class="saving-advice">${bits.join('')}</div><div class="muted">เฉลี่ยจากยอดที่ยังขาด ${money(left)} · เหลือ ${days} วัน</div>`}
function goalCard(g,compact=false){let saved=goalAmount(g.id),pct=num(g.target)>0?Math.min(100,saved/num(g.target)*100):0,done=pct>=100;return `<div class="goal"><div class="goal-head"><div class="goal-name">${esc(g.name)}</div><div class="goal-progress-info"><b>${pct.toFixed(1)}%</b><div class="goal-deadline">${g.deadline?'ครบกำหนด '+esc(g.deadline):'ยังไม่กำหนดวันครบกำหนด'}</div></div></div><div class="progress"><span style="width:${pct}%"></span></div><div class="goal-money-line"><span>เป้าหมาย <b>${money(g.target)}</b></span><span>ออมแล้ว <b>${money(saved)}</b></span><span>เหลือ <b>${money(Math.max(0,num(g.target)-saved))}</b></span></div>${!compact?`<details class="goal-details"><summary>ดูแผนออมเฉลี่ยและจัดการเป้าหมาย</summary>${savingsAdvice(g,saved)}<div class="tiny-actions"><button onclick="formPage('goal','${g.id}')">แก้ไข</button><button onclick="formPage('saving','', '${g.id}')">＋ เติมเงิน</button><button onclick="removeItem('goals','${g.id}')">ลบ</button></div></details>`:''}${done?`<div class="form-actions"><button class="btn" onclick="completeGoal('${g.id}')">✓ ยืนยันเป้าหมายสำเร็จ</button></div>`:''}</div>`}
function completeGoal(id){const g=state.goals.find(x=>x.id===id);if(!g)return;const saved=goalAmount(id);if(saved<num(g.target)){toast('ยอดออมยังไม่ถึงเป้าหมาย');return}if(!confirm(`ยืนยันว่าเป้าหมาย “${g.name}” สำเร็จแล้วใช่ไหม?`))return;const records=state.savings.filter(x=>x.goalId===id).map(x=>({...x}));const weekly={},monthly={};records.forEach(x=>{const d=new Date((x.date||today())+'T00:00:00');const day=new Date(d);day.setDate(d.getDate()-((d.getDay()+6)%7));const wk=day.toLocaleDateString('en-CA');const mo=(x.date||today()).slice(0,7);weekly[wk]=(weekly[wk]||0)+num(x.amount);monthly[mo]=(monthly[mo]||0)+num(x.amount)});state.completedGoals.unshift({...g,completedAt:today(),completedAmount:saved,history:{records,weekly,monthly}});state.goals=state.goals.filter(x=>x.id!==id);persist();go('summary');toast('บันทึกเป้าหมายที่สำเร็จแล้ว 🎉')}
function completedGoalsSection(){if(!state.completedGoals.length)return '<div class="empty">ยังไม่มีเป้าหมายที่ยืนยันว่าสำเร็จ 🌷</div>';return `<div class="record-list">${state.completedGoals.map(g=>`<div class="completed-goal-card"><div class="record"><div class="record-left"><div class="record-icon">🏆</div><div><div class="record-name">${esc(g.name)}</div><div class="record-meta">สำเร็จวันที่ ${esc(g.completedAt||'-')} · ออมได้ ${money(g.completedAmount||g.target)}</div><details class="goal-details"><summary>รายละเอียดความสำเร็จและประวัติ</summary><div class="muted" style="margin:8px 0">ยอดเป้าหมาย ${money(g.target)} · สำเร็จ ${num(g.target)>0?Math.min(100,num(g.completedAmount||g.target)/num(g.target)*100).toFixed(1):100}%</div><b style="font-size:12px">สรุปรายสัปดาห์</b>${Object.keys(g.history?.weekly||{}).sort().map(k=>`<div class="record-meta">สัปดาห์เริ่ม ${esc(k)} · ${money(g.history.weekly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายสัปดาห์</div>'}<b style="font-size:12px;display:block;margin-top:8px">สรุปรายเดือน</b>${Object.keys(g.history?.monthly||{}).sort().map(k=>`<div class="record-meta">${esc(k)} · ${money(g.history.monthly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายเดือน</div>'}<b style="font-size:12px;display:block;margin-top:8px">รายการออมที่ผ่านมา</b>${(g.history?.records||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="record-meta">${esc(x.date||'-')} · ${esc(x.name||'ออมเงิน')} · ${money(x.amount)}</div>`).join('')||'<div class="muted">ไม่มีประวัติรายการ</div>'}</details></div></div><div class="record-right"><span class="pct">สำเร็จ</span></div></div></div>`).join('')}</div>`}

function shapeIcon(name,cls='shape-icon'){const paths={house:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/>',money:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9h19M16.5 12h2M6 5V3.5h12V5"/><circle cx="11" cy="13" r="2.5"/>',pig:'<path d="M5 10 3.5 7l4 .5A9 9 0 0 1 12 6c4.4 0 7.5 2.6 7.5 6.3 0 1.3-.4 2.5-1.2 3.4l.5 3h-4l-.6-1.4H9.7L9 18.7H5.5l.4-3A6 6 0 0 1 4 12.5L2.5 12v-3z"/><path d="M19 10h2.5v4H19"/><circle cx="9" cy="10.5" r=".7"/><circle cx="15" cy="10.5" r=".7"/>',chart:'<path d="M3 3v18h18"/><rect x="6" y="12" width="3.5" height="6" rx=".5"/><rect x="11" y="8" width="3.5" height="10" rx=".5"/><rect x="16" y="4" width="3.5" height="14" rx=".5"/>',heart:'<path d="M20.8 8.8c0 5.1-8.8 11.2-8.8 11.2S3.2 13.9 3.2 8.8A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.5Z"/>',bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/>',spark:'<path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.8 1.8 0 0 1 1.4-3h1.4A3.5 3.5 0 0 0 21 11.2C21 6.7 17 3 12 3Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.8" r="1"/><circle cx="14.5" cy="7" r="1"/><circle cx="17" cy="10" r="1"/>',flower:'<path d="M12 12c-3-1-4-3.5-2.5-5.5C11 4.5 13 5 12 8c1-3 3-3.5 4.5-1.5C18 8.5 15 11 12 12Z"/><path d="M12 12c-3 1-5.5-.5-5.5-3S9 6 10.5 9"/><path d="M12 12c3 1 5.5-.5 5.5-3S15 6 13.5 9"/><path d="M12 12v9M12 17l-4-2M12 19l4-2"/>',leaf:'<path d="M20 4C10 4 4 8 4 15a5 5 0 0 0 5 5c7 0 11-6 11-16Z"/><path d="M3 21c4-6 7-8 13-12"/>'};return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.spark}</svg>`}
function cheerText(amount){const messages=['ทุกบาทที่เก็บ คืออีกก้าวเล็ก ๆ ที่พาเราเข้าใกล้ความฝันนะ','ไม่ต้องรีบเก่งกว่าใคร แค่ค่อย ๆ ทำตามเป้าหมายของตัวเองก็เก่งมากแล้ว','เงินออมอาจเริ่มจากน้อย ๆ แต่ความตั้งใจของเรามีค่ามากเสมอ','วันนี้ทำได้เท่านี้ก็ยอดเยี่ยมแล้ว พรุ่งนี้ค่อยเริ่มใหม่ด้วยใจสบาย ๆ','อย่าลืมภูมิใจในตัวเองนะ เพราะทุกครั้งที่ออมคือการดูแลอนาคตของเรา','เป้าหมายใหญ่เริ่มจากก้าวเล็ก ๆ และมุกเชื่อว่าหนูทำได้','ความสม่ำเสมอสำคัญกว่าความเร็ว ค่อย ๆ เก็บไปทีละนิดนะคนเก่ง','ให้รางวัลตัวเองด้วยคำชมบ้างนะ วันนี้หนูพยายามได้ดีมากแล้ว','เงินทุกบาทที่ตั้งใจเก็บกำลังเล่าเรื่องความพยายามของหนูอยู่','ถ้าวันนี้ยังไม่ถึงเป้าไม่เป็นไร แค่ไม่หยุดเรียนรู้ก็เก่งแล้ว','เก็บเงินด้วยความสุข ไม่ต้องกดดันตัวเองนะ ค่อย ๆ ไปด้วยกัน','ความฝันไม่จำเป็นต้องสำเร็จในวันเดียว ทุกวันของหนูมีความหมาย'];const d=new Date();const index=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%messages.length;return messages[index]}
function cheer(amount){return `<div class="cheer-head"><div class="cheer-icon-box">${shapeIcon('heart','heart-mark')}</div><div><div class="cheer-title">ถึงนักออมคนเก่ง จากน้องมุก ${shapeIcon('flower','flower-mark')}</div><div class="cheer-subtitle">ข้อความให้กำลังใจประจำวัน</div></div></div><div class="cheer-divider"></div><div class="cheer-quote">“${esc(cheerText(amount))}”</div><div class="cheer-sign">— ด้วยกำลังใจจากน้องมุก ${shapeIcon('heart','heart-mark')}</div>`}
function recordRows(items,type){if(!items.length)return `<div class="empty">${shapeIcon('leaf')}<div>ยังไม่มีรายการในส่วนนี้</div></div>`;return `<div class="record-list">${items.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>{let amount=type==='sales'?num(x.qty)*num(x.price):type==='costs'&&x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount);let icon=shapeIcon(type==='savings'?'pig':type==='sales'?'bag':'receipt');return `<div class="record"><div class="record-left"><div class="record-icon">${icon}</div><div><div class="record-name">${esc(x.name||x.note||'รายการ')}</div><div class="record-meta">${esc(x.date||'')} ${x.goalId?'· '+esc(state.goals.find(g=>g.id===x.goalId)?.name||'เป้าหมายที่ถูกลบ'):''} ${x.note?'· '+esc(x.note):''}</div></div></div><div class="record-right"><div class="record-amount">${money(amount)}</div><div class="tiny-actions"><button onclick="formPage('${type.slice(0,-1)}','${x.id}')">แก้ไข</button><button onclick="removeItem('${type}','${x.id}')">ลบ</button></div></div></div>`}).join('')}</div>`}
function dashboard(){let t=totals(),topGoals=state.goals.slice(0,2),recent=state.savings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3);return `${title(esc(state.settings.greeting||'สวัสดี 👋'),'',`<div class="head-actions"><button class="btn secondary" onclick="editGreeting()">✎ แก้ข้อความ</button><button class="btn" onclick="formPage('saving')">＋ บันทึกออม</button></div>`)}<div class="grid stats">${stat(`${shapeIcon('money')} เงินสะสม`,t.savings,'เงินออมที่บันทึกไว้','accent-text')}${stat(`${shapeIcon('pig')} ความคืบหน้าเป้าหมาย`,`${t.savingsPct.toFixed(1)}%`,'เทียบกับเป้าหมายรวม')}${stat(`${shapeIcon('bag')} ยอดขาย <small class="pct">${t.salesPct!==null?t.salesPct.toFixed(1)+'%':'—'}</small>`,t.sales,'เทียบต้นทุน = 100%','green')}${stat(`${t.profit<0?'ขาดทุน':t.profit>0?'กำไร':'เท่าทุน'} <small class="pct">${t.profitPct!==null?t.profitPct.toFixed(1)+'%':'—'}</small>`,t.profit,'ยอดขาย − ต้นทุน',t.profit<0?'red':'green')}</div><section class="card"><div class="section-head"><h3 class="inline-shape">${shapeIcon('target')} เป้าหมายที่กำลังออม</h3><button class="btn secondary" onclick="go('goals')">ดูทั้งหมด</button></div>${topGoals.length?`<div class="goal-list">${topGoals.map(g=>goalCard(g,true)).join('')}</div>`:'<div class="empty">เริ่มสร้างเป้าหมายออมเงินแรกของคุณ 🌱</div>'}<div class="form-actions"><button class="btn" onclick="formPage('goal')">＋ สร้างเป้าหมาย</button></div></section><section class="card" style="margin-top:14px"><div class="section-head"><h3 class="inline-shape">${shapeIcon('spark')} เพิ่มรายการด่วน</h3></div><div class="quick"><button onclick="formPage('saving')"><span>${shapeIcon('pig')}</span>บันทึกออมเงิน</button><button onclick="formPage('sale')"><span>${shapeIcon('bag')}</span>เพิ่มยอดขาย</button><button onclick="formPage('cost')"><span>${shapeIcon('receipt')}</span>เพิ่มต้นทุน</button><button onclick="go('summary')"><span>${shapeIcon('chart')}</span>ดูสรุป</button></div></section><section class="card recent-savings-panel" style="margin-top:14px"><div class="section-head"><h3 class="inline-shape">${shapeIcon('clock')} รายการออมล่าสุด</h3><button class="btn secondary" onclick="go('goals')">ดูทั้งหมด</button></div>${recent.length?recordRows(recent,'savings'):'<div class="empty">ยังไม่มีรายการออมเงิน 💗</div>'}</section>`}
function goalsPage(){let t=totals(),targetPct=t.goalTarget>0?100:0,savedPct=t.goalTarget>0?Math.min(100,t.goalSaved/t.goalTarget*100):0,leftPct=t.goalTarget>0?Math.max(0,100-savedPct):0;return `${title('ออมเงินและเป้าหมาย','ติดตามความคืบหน้า พร้อมคำแนะนำยอดออมเฉลี่ย',`<button class="btn" onclick="formPage('goal')">＋ เป้าหมายใหม่</button>`)}<div class="grid stats">${stat('เป้าหมาย',`${state.goals.length} รายการ`,'จำนวนเป้าหมาย')}${stat(`ยอดเป้าหมายรวม <small class="pct">${targetPct}%</small>`,t.goalTarget,'รวมทุกเป้าหมาย')}${stat(`ออมตามเป้าหมาย <small class="pct">${savedPct.toFixed(1)}%</small>`,t.goalSaved,'สัดส่วนที่ออมได้','green')}${stat(`ยังขาดอีก <small class="pct">${leftPct.toFixed(1)}%</small>`,Math.max(0,t.goalTarget-t.goalSaved),'สัดส่วนที่ยังต้องออม','red')}</div><section class="card"><h3>เป้าหมายทั้งหมด</h3>${state.goals.length?`<div class="goal-list">${state.goals.map(g=>goalCard(g,false)).join('')}</div>`:'<div class="empty">ยังไม่มีเป้าหมาย กด “เป้าหมายใหม่” เพื่อเริ่มต้น 💗</div>'}</section><section class="card cheer-card" style="margin-top:14px">${state.savings.length?cheer(t.savings):`<div class="cheer-head"><div class="cheer-icon-box">${shapeIcon('heart','heart-mark')}</div><div><div class="cheer-title">ถึงนักออมคนเก่ง จากน้องมุก ${shapeIcon('flower','flower-mark')}</div><div class="cheer-subtitle">ข้อความให้กำลังใจประจำวัน</div></div></div><div class="cheer-divider"></div><div class="cheer-quote">“ทุกการเริ่มต้นมีความหมาย ลองบันทึกเงินออมแรกของหนูดูนะ”</div><div class="cheer-sign">— ด้วยกำลังใจจากน้องมุก ${shapeIcon('heart','heart-mark')}</div>`}</section><section class="card" style="margin-top:14px"><div class="section-head"><h3>ประวัติการออม</h3><span class="muted">${state.savings.length} รายการ</span></div>${recordRows(state.savings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')),'savings')}</section>`}
function investmentsPage(){let t=totals();return `${title('พอร์ตการลงทุน 📈','บันทึกเงินต้นและมูลค่าปัจจุบันที่คุณตรวจสอบเอง',`<button class="btn" onclick="formPage('investment')">＋ เพิ่มการลงทุน</button>`)}<div class="grid stats">${stat('เงินต้นลงทุน',t.invested,'ยอดเงินต้นที่บันทึกไว้')}${stat('มูลค่าปัจจุบัน',state.investments.reduce((a,x)=>a+(x.currentValue===''||x.currentValue==null?num(x.amount):num(x.currentValue)),0),'ตามมูลค่าที่บันทึก')}${stat('กำไร/ขาดทุนโดยประมาณ',state.investments.reduce((a,x)=>a+(x.currentValue===''||x.currentValue==null?num(x.amount):num(x.currentValue))-num(x.amount),0),'มูลค่าปัจจุบัน − เงินต้น')}${stat('จำนวนรายการ',`${state.investments.length} รายการ`,'รายการลงทุน')}</div><section class="card"><h3>รายการลงทุน</h3>${recordRows(state.investments,'investments')}</section><div class="footnote">หน้านี้เป็นสมุดบันทึกเท่านั้น ไม่ได้เชื่อมต่อโบรกเกอร์หรือแสดงราคาตลาดแบบเรียลไทม์</div>`}
function summaryPage(){let t=totals(),rows=[['เงินออม',t.savings,'—'],['ยอดขาย',t.sales,t.salesPct!==null?t.salesPct.toFixed(1)+'%':'—'],['ต้นทุน',t.costs,t.costPct!==null?'100.0%':'—'],[t.profit<0?'ขาดทุน':t.profit>0?'กำไร':'เท่าทุน',t.profit,t.profitPct!==null?t.profitPct.toFixed(1)+'%':'—']];return `${title('สรุปการเงิน','ภาพรวมและแนวโน้มจากข้อมูลที่บันทึกไว้')}<div class="grid stats">${stat('เงินออมสะสม',t.savings,'รวมเงินออม','accent-text')}${stat(`ยอดขาย <small class="pct">${t.salesPct!==null?t.salesPct.toFixed(1)+'%':'—'}</small>`,t.sales,'เทียบต้นทุน = 100%','green')}${stat(`ต้นทุน <small class="pct">${t.costPct!==null?'100.0%':'—'}</small>`,t.costs,'กำหนดให้ต้นทุนเป็นฐาน 100%')}${stat(`${t.profit<0?'ขาดทุน':t.profit>0?'กำไร':'เท่าทุน'} <small class="pct">${t.profitPct!==null?t.profitPct.toFixed(1)+'%':'—'}</small>`,t.profit,'ยอดขาย − ต้นทุน',t.profit<0?'red':'green')}</div><section class="card" style="margin-top:14px"><h3>สรุปตัวเลข</h3><div class="table-wrap"><table style="min-width:0"><thead><tr><th>หมวดหมู่</th><th>ยอดรวม</th><th>คิดเป็นเปอร์เซ็นต์</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div></section><section class="card" style="margin-top:14px"><div class="section-head"><h3 class="inline-shape">${shapeIcon('target')} เป้าหมายที่สำเร็จแล้ว</h3><span class="muted">${state.completedGoals.length} เป้าหมาย</span></div>${completedGoalsSection()}</section>`}
function salesPage(){let t=totals(),pct=t.profitPct!==null?Math.abs(t.profitPct).toFixed(1)+'%':'—',profitLabel=t.profit<0?'ขาดทุน':t.profit>0?'กำไร':'เท่าทุน',profitClass=t.profit<0?'red':'green';return `${title('ยอดขายและต้นทุน','ต้นทุนเป็นฐาน 100% เพื่อเทียบยอดขายและกำไร/ขาดทุน',`<div class="head-actions"><button class="btn" onclick="formPage('sale')">＋ ยอดขาย</button><button class="btn secondary" onclick="formPage('cost')">＋ ต้นทุน</button></div>`)}<div class="sales-metrics"><div class="sales-metric"><div class="sales-metric-label">ยอดขายรวม</div><div class="sales-metric-value green">${money(t.sales)}</div><div class="sales-metric-foot">${t.salesPct!==null?t.salesPct.toFixed(1)+'%':'—'} ของต้นทุน</div></div><div class="sales-metric"><div class="sales-metric-label">ต้นทุนรวม</div><div class="sales-metric-value">${money(t.costs)}</div><div class="sales-metric-foot">กำหนดเป็นฐาน 100%</div></div><div class="sales-metric"><div class="sales-metric-label">${profitLabel}</div><div class="sales-metric-value ${profitClass}">${money(t.profit)}</div><div class="sales-metric-foot">ยอดขาย − ต้นทุน</div></div><div class="sales-metric"><div class="sales-metric-label">คิดเปอร์เซ็นต์</div><div class="sales-metric-pct ${profitClass}">${pct}</div><div class="sales-metric-foot">${t.profit<0?'เปอร์เซ็นต์ขาดทุน':t.profit>0?'เปอร์เซ็นต์กำไร':'เท่าทุน'}</div></div></div><section class="card"><div class="section-head"><h3>รายการบันทึก</h3><span class="muted">ขาย ${state.sales.length} · ต้นทุน ${state.costs.length}</span></div><div class="record-tabs"><button id="tabSales" class="selected" onclick="switchRecordTab('sales')">${shapeIcon('bag')} รายการขาย (${state.sales.length})</button><button id="tabCosts" onclick="switchRecordTab('costs')">${shapeIcon('receipt')} รายการต้นทุน (${state.costs.length})</button></div><div id="salesRecordPanel">${recordRows(state.sales,'sales')}</div><div id="costsRecordPanel" class="hidden">${recordRows(state.costs,'costs')}</div></section>`}
function planningPage(){return `${title('วางแผนการเงิน 🗓️','ตั้งงบประมาณหรือเป้าหมายรายเดือน',`<button class="btn" onclick="formPage('plan')">＋ เพิ่มแผน</button>`)}<section class="card"><h3>แผนของฉัน</h3>${state.plans.length?`<div class="record-list">${state.plans.map(p=>`<div class="record"><div><div class="record-name">${esc(p.name)}</div><div class="record-meta">${esc(p.month||'')} · ${esc(p.note||'')}</div></div><div class="record-right"><div class="record-amount">${money(p.amount)}</div><div class="tiny-actions"><button onclick="formPage('plan','${p.id}')">แก้ไข</button><button onclick="removeItem('plans','${p.id}')">ลบ</button></div></div></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีแผนการเงิน เพิ่มงบออม เป้าหมายยอดขาย หรืองบใช้จ่ายได้ที่นี่</div>'}</section>`}
function settingsPage(){return `${title('ตั้งค่าและธีม 🎨','ปรับสีและคำทักทายหน้าแรก ชื่อหัวเว็บนี้เปลี่ยนไม่ได้')}<section class="card"><h3>เลือกธีมสี</h3><div class="theme-grid">${Object.entries(themes).map(([id,t])=>`<button class="theme-choice ${state.settings.theme===id?'selected':''}" onclick="setTheme('${id}')"><div class="swatches"><i style="background:${t.bg}"></i><i style="background:${t.accent}"></i><i style="background:${t.soft}"></i></div><b>${t.label}</b></button>`).join('')}</div><div class="field" style="margin-top:18px"><label>คำทักทายหน้าแรก (เปลี่ยนได้)</label><input id="settingGreeting" value="${esc(state.settings.greeting||'สวัสดี 👋')}" placeholder="เช่น สวัสดีคนเก่ง"></div><div class="form-actions"><button class="btn" onclick="saveSettings()">บันทึกการตั้งค่า</button><button class="btn secondary" onclick="exportData()">ส่งออกข้อมูล JSON</button><label class="btn secondary" for="importFile">นำเข้าข้อมูล</label><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(event)"></div></section><section class="card" style="margin-top:14px"><h3>บัญชีและข้อมูล</h3><p class="muted">บัญชีที่เข้าสู่ระบบ: ${esc(user?.email||user?.displayName||'')}</p><p class="muted">ข้อมูลบันทึกออนไลน์แยกตามบัญชี และเปิดดูได้เมื่อเข้าสู่ระบบบัญชีเดิมจากอุปกรณ์อื่น</p><button class="btn danger" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button></section>`}
function morePage(){return `${title('เพิ่มเติม ✨','เครื่องมือและการตั้งค่า')}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><button class="card" style="text-align:left" onclick="go('sales')"><h3>🛍️ ยอดขายและต้นทุน</h3><div class="muted">บันทึกสินค้า ต้นทุน และกำไร</div></button><button class="card" style="text-align:left" onclick="go('settings')"><h3>🎨 ตั้งค่าและธีม</h3><div class="muted">เลือกสี เปลี่ยนชื่อ และสำรองข้อมูล</div></button><button class="card" style="text-align:left" onclick="go('records')"><h3>📚 รายการทั้งหมด</h3><div class="muted">ดูและจัดการข้อมูลทุกประเภท</div></button></div>`}
function recordsPage(){return `${title('รายการทั้งหมด 📚','ตรวจสอบ แก้ไข หรือลบรายการที่บันทึก')}<section class="card"><h3>เงินออม</h3>${recordRows(state.savings,'savings')}</section><section class="card" style="margin-top:12px"><h3>ยอดขาย</h3>${recordRows(state.sales,'sales')}</section><section class="card" style="margin-top:12px"><h3>ต้นทุน</h3>${recordRows(state.costs,'costs')}</section>`}
function formPage(type,id='',goalId=''){edit={type,id:id||null};let arrKey={goal:'goals',saving:'savings',sale:'sales',cost:'costs'}[type],x=id?state[arrKey].find(y=>y.id===id):{};x=x||{};let isGoal=type==='goal',isSaving=type==='saving',isSale=type==='sale',isCost=type==='cost';let heading=(id?'แก้ไข':'เพิ่ม')+({goal:'เป้าหมาย',saving:'เงินออม',sale:'ยอดขาย',cost:'ต้นทุน'}[type]||'รายการ');let fields='';
const input=(label,key,placeholder='',kind='text',value=x[key]??'',required=false)=>`<div class="field"><label>${label}${required?' *':''}</label><input name="${key}" type="${kind}" value="${esc(value)}" placeholder="${placeholder}" ${required?'required':''} ${kind==='number'?'step="0.01" min="0"':''}></div>`;
if(isGoal)fields=input('ชื่อเป้าหมาย','name','เช่น เก็บเงินซื้อแท็บเล็ต','text',x.name,true)+input('ยอดเงินเป้าหมาย (บาท)','target','10000','number',x.target,true)+input('วันครบเป้าหมาย','deadline','','date',x.deadline||'')+input('หมายเหตุ','note','รายละเอียดเพิ่มเติม','text',x.note||'');
if(isSaving)fields=input('รายการ / ที่มาของเงิน','name','เช่น ออมจากค่าขนม','text',x.name,true)+input('จำนวนเงิน (บาท)','amount','500','number',x.amount,true)+input('วันที่','date','','date',x.date||today())+`<div class="field"><label>เติมเข้าเป้าหมาย</label><select name="goalId"><option value="">ออมทั่วไป (ไม่ผูกเป้าหมาย)</option>${state.goals.map(g=>`<option value="${g.id}" ${(x.goalId||goalId)===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>`+input('หมายเหตุ','note','เพิ่มเติม','text',x.note||'');

if(isSale)fields=input('สินค้า / รายการขาย','name','เช่น เครป','text',x.name,true)+`<div class="field"><label>จำนวน</label><div class="stepper"><button type="button" onclick="stepQty(-1)">−</button><input id="qtyField" name="qty" type="number" min="1" step="1" value="${esc(x.qty??1)}" required><button type="button" onclick="stepQty(1)">＋</button></div></div>`+input('ราคาต่อหน่วย (บาท)','price','30','number',x.price,true)+input('วันที่','date','','date',x.date||today())+input('หมายเหตุ','note','ช่องทางขาย / ลูกค้า','text',x.note||'');
if(isCost)fields=input('ชื่อค่าใช้จ่าย / ต้นทุน','name','เช่น วัตถุดิบ','text',x.name,true)+`<div class="field"><label>จำนวน</label><div class="stepper"><button type="button" onclick="stepQty(-1)">−</button><input id="qtyField" name="qty" type="number" min="1" step="1" value="${esc(x.qty??1)}" required><button type="button" onclick="stepQty(1)">＋</button></div></div>`+input('ราคาต่อหน่วย / ต้นทุนต่อชิ้น (บาท)','price','150','number',x.price??x.amount,true)+input('วันที่','date','','date',x.date||today())+input('หมวดหมู่','category','เช่น วัตถุดิบ / ค่าเดินทาง','text',x.category||'')+input('หมายเหตุ','note','เพิ่มเติม','text',x.note||'');

$('main').innerHTML=`${title(heading,'กรอกข้อมูลให้ครบแล้วกดบันทึก')}<section class="card"><form id="dataForm"><div class="form-grid">${fields}</div><div class="form-actions"><button class="btn" type="submit">บันทึกข้อมูล</button><button class="btn secondary" type="button" onclick="go('${type==='goal'?'goals':type==='saving'?'goals':type==='sale'||type==='cost'?'sales':'dashboard'}')">ยกเลิก</button></div></form></section>`;
$('dataForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());for(let k of ['amount','target','qty','price'])if(obj[k]!==undefined&&obj[k]!=='')obj[k]=num(obj[k]);if(type==='cost'){obj.amount=num(obj.qty)*num(obj.price)}if(!obj.date&&['saving','sale','cost'].includes(type))obj.date=today();let key=arrKey;obj.id=id||crypto.randomUUID();if(id){let i=state[key].findIndex(y=>y.id===id);if(i>=0)state[key][i]=obj;else state[key].push(obj)}else state[key].push(obj);persist();go(type==='goal'||type==='saving'?'goals':type==='sale'||type==='cost'?'sales':'dashboard');toast(type==='saving'?cheerText(obj.amount):'บันทึกข้อมูลแล้ว 💗')};
}
function switchRecordTab(which){const salesPanel=$('salesRecordPanel'),costPanel=$('costsRecordPanel'),salesTab=$('tabSales'),costTab=$('tabCosts');if(!salesPanel||!costPanel||!salesTab||!costTab)return;let sales=which==='sales';salesPanel.classList.toggle('hidden',!sales);costPanel.classList.toggle('hidden',sales);salesTab.classList.toggle('selected',sales);costTab.classList.toggle('selected',!sales)}
function go(p){page=p;let content={dashboard,goals:goalsPage,summary:summaryPage,investments:investmentsPage,sales:salesPage,planning:planningPage,settings:settingsPage,more:morePage,records:recordsPage}[p];if(!content){page='dashboard';content=dashboard}document.querySelectorAll('.nav-inner button').forEach(b=>b.classList.remove('active'));let navKey=({'dashboard':'dashboard','sales':'sales','goals':'goals','summary':'summary'})[p];$('nav-'+navKey)?.classList.add('active');$('main').innerHTML=content();window.scrollTo({top:0,behavior:'smooth'})}
function removeItem(key,id){if(!confirm('ต้องการลบรายการนี้ใช่ไหม?'))return;state[key]=state[key].filter(x=>x.id!==id);persist();go(page);toast('ลบรายการแล้ว')}
function setTheme(id){state.settings.theme=id;persist();go('settings')}
function saveSettings(){state.settings.greeting=$('settingGreeting').value.trim()||'สวัสดี 👋';persist();go('settings');toast('บันทึกการตั้งค่าแล้ว')}
function editGreeting(){let current=state.settings.greeting||'สวัสดี 👋';let next=prompt('อยากให้หน้าหลักทักทายว่าอะไร?',current);if(next!==null){state.settings.greeting=next.trim()||'สวัสดี 👋';persist();go('dashboard');toast('เปลี่ยนคำทักทายแล้ว 💗')}}
function stepQty(delta){let f=$('qtyField');if(!f)return;f.value=Math.max(1,(parseInt(f.value,10)||1)+delta)}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bloom-finance-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.completedGoals))x.completedGoals=[];for(let k of ['goals','savings','investments','sales','costs','plans'])if(!Array.isArray(x[k]))throw Error('invalid');state={...state,...x};state.settings={...themes.pink,...state.settings};persist();go('settings');toast('นำเข้าข้อมูลสำเร็จ')}catch(err){alert('ไฟล์ไม่ถูกต้องหรืออ่านไม่ได้')}};r.readAsText(file)}
function clearAll(){if(!confirm('ล้างข้อมูลทั้งหมดใช่ไหม? การกระทำนี้ย้อนกลับไม่ได้'))return;state={goals:[],completedGoals:[],savings:[],investments:[],sales:[],costs:[],plans:[],settings:{theme:'pink',name:'พื้นที่การเงินของเรา',greeting:'สวัสดี 👋'}};persist();go('dashboard');toast('ล้างข้อมูลแล้ว')}
function toggleAuth(){authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'ยินดีต้อนรับ 💗':'สร้างบัญชีใหม่ 🌱';$('authSubtitle').textContent=authMode==='login'?'เข้าสู่ระบบเพื่อดูข้อมูลที่บันทึกไว้':'สมัครบัญชีเพื่อเริ่มบันทึกข้อมูลส่วนตัว';$('authSubmit').textContent=authMode==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก';$('authPrompt').textContent=authMode==='login'?'ยังไม่มีบัญชี?':'มีบัญชีแล้ว?';$('authSwitch').textContent=authMode==='login'?'สมัครสมาชิก':'เข้าสู่ระบบ';$('authPassword').autocomplete=authMode==='login'?'current-password':'new-password'}
function authError(e){const code=e?.code||'';const messages={'auth/email-already-in-use':'อีเมลนี้มีบัญชีอยู่แล้ว กรุณาเข้าสู่ระบบ','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง','auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีนี้ กรุณาสมัครสมาชิกก่อน','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร','auth/popup-closed-by-user':'ปิดหน้าต่างเข้าสู่ระบบ Google ก่อนดำเนินการเสร็จ','auth/popup-blocked':'เบราว์เซอร์บล็อกหน้าต่าง Google กรุณาอนุญาตป๊อปอัป','auth/unauthorized-domain':'โดเมนเว็บไซต์ยังไม่ได้เพิ่มใน Firebase Authentication > Settings > Authorized domains','auth/network-request-failed':'เชื่อมต่ออินเทอร์เน็ตไม่ได้ กรุณาลองใหม่','auth/operation-not-allowed':'ยังไม่ได้เปิดวิธีเข้าสู่ระบบนี้ใน Firebase Console'};return messages[code]||('ดำเนินการไม่สำเร็จ ('+code+'). กรุณาตรวจสอบการตั้งค่า Firebase แล้วลองใหม่')}
async function submitAuth(){const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<6){alert('กรอกอีเมลให้ถูกต้องและรหัสผ่านอย่างน้อย 6 ตัวอักษร');return}if(!firebaseReady||!auth){alert('เชื่อมต่อ Firebase ไม่สำเร็จ จึงยังไม่สามารถเข้าสู่ระบบจริงได้ กรุณาตรวจสอบการตั้งค่าและอินเทอร์เน็ต');return}try{const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');if(authMode==='signup')await m.createUserWithEmailAndPassword(auth,email,password);else await m.signInWithEmailAndPassword(auth,email,password)}catch(e){alert(authError(e))}}
async function signInWithGoogle(){if(!firebaseReady||!auth){alert('เชื่อมต่อ Firebase ไม่สำเร็จ กรุณาตรวจสอบการตั้งค่าและอินเทอร์เน็ต');return}try{const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');const provider=new m.GoogleAuthProvider();await m.signInWithPopup(auth,provider)}catch(e){alert(authError(e))}}
async function resetPassword(){const email=$('authEmail').value.trim();if(!email){alert('กรอกอีเมลในช่องอีเมลก่อน แล้วกดลืมรหัสผ่านอีกครั้ง');return}if(!firebaseReady||!auth){alert('เชื่อมต่อ Firebase ไม่สำเร็จ กรุณาตรวจสอบการตั้งค่า');return}try{const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');await m.sendPasswordResetEmail(auth,email);alert('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว กรุณาตรวจสอบกล่องจดหมาย')}catch(e){alert(authError(e))}}
function showApp(){$('authView').classList.add('hidden');$('appView').classList.remove('hidden');applyTheme();go(page)}
async function logout(){try{clearTimeout(syncTimer);await pendingSync;if(firebaseReady&&auth&&auth.currentUser){const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');await m.signOut(auth)}if(unsub){unsub();unsub=null}user=null;normalizeState(freshState());$('appView').classList.add('hidden');$('authView').classList.remove('hidden');$('authPassword').value='';$('authTitle').textContent='ยินดีต้อนรับ 💗';$('authSubtitle').textContent='เข้าสู่ระบบเพื่อดูข้อมูลที่บันทึกไว้';authMode='login';$('authSubmit').textContent='เข้าสู่ระบบ';$('authPrompt').textContent='ยังไม่มีบัญชี?';$('authSwitch').textContent='สมัครสมาชิก'}catch(e){alert(authError(e))}}
window.go=go;window.formPage=formPage;window.switchRecordTab=switchRecordTab;window.completeGoal=completeGoal;window.stepQty=stepQty;window.editGreeting=editGreeting;window.removeItem=removeItem;window.setTheme=setTheme;window.saveSettings=saveSettings;window.exportData=exportData;window.importData=importData;window.clearAll=clearAll;window.toggleAuth=toggleAuth;window.submitAuth=submitAuth;window.signInWithGoogle=signInWithGoogle;window.resetPassword=resetPassword;window.logout=logout;
normalizeState(freshState());
{
 try{
  const appMod=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const authMod=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const fs=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const app=appMod.initializeApp(firebaseConfig);auth=authMod.getAuth(app);db=fs.getFirestore(app);firebaseReady=true;
  authMod.onAuthStateChanged(authMod.getAuth(app),async u=>{if(unsub){unsub();unsub=null}user=u;if(!u){normalizeState(freshState());$('appView').classList.add('hidden');$('authView').classList.remove('hidden');return}normalizeState(freshState());const ref=fs.doc(db,'users',u.uid,'app','data');let firstSnapshot=true;unsub=fs.onSnapshot(ref,s=>{if(s.exists()){normalizeState(s.data());applyTheme();showApp()}else if(firstSnapshot){normalizeState(freshState());persist();showApp()}firstSnapshot=false},e=>{console.error('Firestore read failed',e);alert('อ่านข้อมูลจากคลาวด์ไม่ได้ กรุณาตรวจสอบ Firestore Rules และอินเทอร์เน็ต')})});
 }catch(e){firebaseReady=false;console.error(e);$('authSubtitle').textContent='เชื่อมต่อระบบไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตและการตั้งค่า Firebase แล้วโหลดหน้าใหม่';$('authFootnote').textContent='ไม่เปิดโหมดทดลอง ข้อมูลจะไม่ถูกบันทึกในเครื่องแทนคลาวด์'}
}
