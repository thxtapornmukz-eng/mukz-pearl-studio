function copyFacebookLink(){const url='https://www.facebook.com/share/1BucWPzKeb/';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>toast('คัดลอกลิงก์ Facebook แล้ว 💗')).catch(()=>copyLinkFallback(url))}else copyLinkFallback(url)}

function applyTheme(){let t=themes[state.settings.theme]||themes.pink;let r=document.documentElement.style;/* โหมดมืดยังคงโทนสีประจำธีม โดยแต้มสีธีมลงบนพื้นหลังและการ์ด */r.setProperty('--bg',darkMode?`color-mix(in srgb, ${t.bg} 13%, #17141b)`:t.bg);r.setProperty('--card',darkMode?`color-mix(in srgb, ${t.accent} 8%, #25212b)`:t.card);r.setProperty('--ink',darkMode?'#f5eff8':'#302a35');r.setProperty('--muted',darkMode?'#b9afc2':'#8b8290');r.setProperty('--line',darkMode?`color-mix(in srgb, ${t.accent} 22%, #403747)`:'#eee4ec');r.setProperty('--accent',t.accent);r.setProperty('--accent-soft',darkMode?`color-mix(in srgb, ${t.accent} 24%, #25212b)`:t.soft);r.setProperty('--accent-deep',darkMode?`color-mix(in srgb, ${t.accent} 58%, #ffffff)`:t.deep);document.documentElement.style.colorScheme=darkMode?'dark':'light';document.documentElement.classList.toggle('dark-mode',darkMode);const b=$('modeToggle');if(b){b.innerHTML=darkMode?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';b.title=darkMode?'เปลี่ยนเป็นโหมดสว่าง':'เปลี่ยนเป็นโหมดมืด';b.setAttribute('aria-label',b.title)}}
function toggleDarkMode(){darkMode=!darkMode;try{localStorage.setItem('amukz-dark-mode',String(darkMode))}catch(e){}applyTheme()}
function totals(){let savings=state.savings.reduce((a,x)=>a+num(x.amount),0), sales=state.sales.reduce((a,x)=>a+num(x.qty)*num(x.price),0), costs=state.costs.reduce((a,x)=>a+(x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount)),0), goalTarget=state.goals.reduce((a,x)=>a+num(x.target),0),goalSaved=state.goals.reduce((a,g)=>a+goalAmount(g.id),0),profit=sales-costs;return{savings,sales,costs,profit,goalTarget,goalSaved,salesPct:costs>0?sales/costs*100:null,costPct:costs>0?100:null,profitPct:costs>0?profit/costs*100:null,savingsPct:goalTarget>0?Math.min(100,goalSaved/goalTarget*100):0}}
function goalAmount(id){return state.savings.filter(x=>x.goalId===id).reduce((a,x)=>a+num(x.amount),0)}
function freshState(){return {goals:[],completedGoals:[],savings:[],investments:[],sales:[],costs:[],plans:[],settings:{theme:'pink',name:'พื้นที่การเงินของเรา',greeting:'สวัสดี 👋'}}}
function normalizeState(data={}){state={...freshState(),...data};state.settings={...freshState().settings,...(data.settings||{})};for(const k of ['goals','completedGoals','savings','investments','sales','costs','plans','products'])if(!Array.isArray(state[k]))state[k]=[];}
function persist(){applyTheme();if(!firebaseReady||!user){toast('กรุณาเข้าสู่ระบบก่อนบันทึกข้อมูล');return}clearTimeout(syncTimer);const uid=user.uid;const snapshot=JSON.parse(JSON.stringify(state));pendingSync=pendingSync.then(async()=>{try{const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');if(!user||user.uid!==uid)return;await setDoc(doc(db,'users',uid,'app','data'),snapshot)}catch(e){console.error('Firestore save failed',e);toast('บันทึกออนไลน์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต')}})}
function stat(label,value,foot,cls=''){let shown=typeof value==='string'?esc(value):money(value);return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${shown}</div><div class="stat-foot">${foot||''}</div></div>`}
function title(h,p,action=''){const extra=p===''?' greeting-title':'';return `<div class="page-title${extra}"><div><h2>${h}</h2>${p?`<p>${p}</p>`:''}</div>${action}</div>`}
function savingsAdvice(g,saved){if(!g.deadline)return '<div class="muted">เพิ่มวันครบเป้าหมายเพื่อคำนวณยอดออมเฉลี่ย ✨</div>';let todayDate=new Date(today()+'T00:00:00'),end=new Date(g.deadline+'T00:00:00');let days=Math.max(0,Math.ceil((end-todayDate)/86400000)),left=Math.max(0,num(g.target)-saved);if(left<=0)return '<div class="cheer">🎉 เป้าหมายสำเร็จแล้ววว! เก่งที่สุดเลยยย 💖</div>';let bits=[`<span>วันละ <b>${money(left/Math.max(1,days))}</b></span>`];if(days>7)bits.push(`<span>สัปดาห์ละ <b>${money(left/Math.max(1,days/7))}</b></span>`);if(days>30)bits.push(`<span>เดือนละ <b>${money(left/Math.max(1,days/30.4375))}</b></span>`);if(days>365)bits.push(`<span>ปีละ <b>${money(left/Math.max(1,days/365.25))}</b></span>`);return `<div class="saving-advice">${bits.join('')}</div><div class="muted">เฉลี่ยจากยอดที่ยังขาด ${money(left)} · เหลือ ${days} วัน</div>`}
function goalCard(g,compact=false){let saved=goalAmount(g.id),pct=num(g.target)>0?Math.min(100,saved/num(g.target)*100):0,done=pct>=100;return `<div class="goal${compact?' compact-goal':''}"><div class="goal-head"><div class="goal-name">${esc(g.name)}</div><div class="goal-progress-info"><b>${pct.toFixed(1)}%</b><div class="goal-deadline">${g.deadline?'ครบกำหนด '+esc(g.deadline):'ยังไม่กำหนดวันครบกำหนด'}</div></div></div><div class="progress"><span style="width:${pct}%"></span></div><div class="goal-money-line"><span>เป้าหมาย <b>${money(g.target)}</b></span><span>ออมแล้ว <b>${money(saved)}</b></span><span>เหลือ <b>${money(Math.max(0,num(g.target)-saved))}</b></span></div>${!compact?`<details class="goal-details"><summary>ดูแผนออมเฉลี่ยและจัดการเป้าหมาย</summary>${savingsAdvice(g,saved)}<div class="tiny-actions goal-order-actions"><button type="button" aria-label="เลื่อนเป้าหมายขึ้น" title="เลื่อนขึ้น" onclick="moveGoal('${g.id}',-1)">▲</button><button type="button" aria-label="เลื่อนเป้าหมายลง" title="เลื่อนลง" onclick="moveGoal('${g.id}',1)">▼</button><button onclick="formPage('goal','${g.id}')">แก้ไข</button><button onclick="formPage('saving','', '${g.id}')">＋ เติมเงิน</button><button onclick="withdrawGoal('${g.id}')">ถอนเงิน</button><button onclick="removeItem('goals','${g.id}')">ลบ</button></div></details>`:''}${done?`<div class="form-actions"><button class="btn" onclick="completeGoal('${g.id}')">✓ ยืนยันเป้าหมายสำเร็จ</button></div>`:''}</div>`}
function completeGoal(id){const g=state.goals.find(x=>x.id===id);if(!g)return;const saved=goalAmount(id);if(saved<num(g.target)){toast('ยอดออมยังไม่ถึงเป้าหมาย');return}if(!confirm(`ยืนยันว่าเป้าหมาย “${g.name}” สำเร็จแล้วใช่ไหม?`))return;const records=state.savings.filter(x=>x.goalId===id).map(x=>({...x}));const weekly={},monthly={};records.forEach(x=>{const d=new Date((x.date||today())+'T00:00:00');const day=new Date(d);day.setDate(d.getDate()-((d.getDay()+6)%7));const wk=day.toLocaleDateString('en-CA');const mo=(x.date||today()).slice(0,7);weekly[wk]=(weekly[wk]||0)+num(x.amount);monthly[mo]=(monthly[mo]||0)+num(x.amount)});state.completedGoals.unshift({...g,completedAt:today(),completedAmount:saved,history:{records,weekly,monthly}});state.goals=state.goals.filter(x=>x.id!==id);persist();go('summary');toast('บันทึกเป้าหมายที่สำเร็จแล้ว 🎉')}
function completedGoalsSection(){if(!state.completedGoals.length)return '<div class="empty">ยังไม่มีเป้าหมายที่ยืนยันว่าสำเร็จ 🌷</div>';return `<div class="record-list">${state.completedGoals.map(g=>`<div class="completed-goal-card"><div class="record"><div class="record-left"><div class="record-icon">🏆</div><div><div class="record-name">${esc(g.name)}</div><div class="record-meta">สำเร็จวันที่ ${esc(g.completedAt||'-')} · ออมได้ ${money(g.completedAmount||g.target)}</div><details class="goal-details"><summary>รายละเอียดความสำเร็จและประวัติ</summary><div class="muted" style="margin:8px 0">ยอดเป้าหมาย ${money(g.target)} · สำเร็จ ${num(g.target)>0?Math.min(100,num(g.completedAmount||g.target)/num(g.target)*100).toFixed(1):100}%</div><b style="font-size:12px">สรุปรายสัปดาห์</b>${Object.keys(g.history?.weekly||{}).sort().map(k=>`<div class="record-meta">สัปดาห์เริ่ม ${esc(k)} · ${money(g.history.weekly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายสัปดาห์</div>'}<b style="font-size:12px;display:block;margin-top:8px">สรุปรายเดือน</b>${Object.keys(g.history?.monthly||{}).sort().map(k=>`<div class="record-meta">${esc(k)} · ${money(g.history.monthly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายเดือน</div>'}<b style="font-size:12px;display:block;margin-top:8px">รายการออมที่ผ่านมา</b>${(g.history?.records||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="record-meta">${esc(x.date||'-')} · ${esc(x.name||'ออมเงิน')} · ${money(x.amount)}</div>`).join('')||'<div class="muted">ไม่มีประวัติรายการ</div>'}</details></div></div><div class="record-right"><span class="pct">สำเร็จ</span><div class="tiny-actions"><button class="danger" onclick="removeCompletedGoal('${g.id}')">ลบเป้าหมาย</button></div></div></div></div>`).join('')}</div>`}

function shapeIcon(name,cls='shape-icon'){const paths={house:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/>',money:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9h19M16.5 12h2M6 5V3.5h12V5"/><circle cx="11" cy="13" r="2.5"/>',pig:'<path d="M5 10 3.5 7l4 .5A9 9 0 0 1 12 6c4.4 0 7.5 2.6 7.5 6.3 0 1.3-.4 2.5-1.2 3.4l.5 3h-4l-.6-1.4H9.7L9 18.7H5.5l.4-3A6 6 0 0 1 4 12.5L2.5 12v-3z"/><path d="M19 10h2.5v4H19"/><circle cx="9" cy="10.5" r=".7"/><circle cx="15" cy="10.5" r=".7"/>',chart:'<path d="M3 3v18h18"/><rect x="6" y="12" width="3.5" height="6" rx=".5"/><rect x="11" y="8" width="3.5" height="10" rx=".5"/><rect x="16" y="4" width="3.5" height="14" rx=".5"/>',heart:'<path d="M20.8 8.8c0 5.1-8.8 11.2-8.8 11.2S3.2 13.9 3.2 8.8A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.5Z"/>',bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/>',spark:'<path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>', 'target-arrow':'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M21 3 12.5 11.5M15 3h6v6"/><path d="m18 6-5 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.8 1.8 0 0 1 1.4-3h1.4A3.5 3.5 0 0 0 21 11.2C21 6.7 17 3 12 3Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.8" r="1"/><circle cx="14.5" cy="7" r="1"/><circle cx="17" cy="10" r="1"/>',flower:'<path d="M12 12c-3-1-4-3.5-2.5-5.5C11 4.5 13 5 12 8c1-3 3-3.5 4.5-1.5C18 8.5 15 11 12 12Z"/><path d="M12 12c-3 1-5.5-.5-5.5-3S9 6 10.5 9"/><path d="M12 12c3 1 5.5-.5 5.5-3S15 6 13.5 9"/><path d="M12 12v9M12 17l-4-2M12 19l4-2"/>',leaf:'<path d="M20 4C10 4 4 8 4 15a5 5 0 0 0 5 5c7 0 11-6 11-16Z"/><path d="M3 21c4-6 7-8 13-12"/>'};return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.spark}</svg>`}
function cheerText(amount){const messages=['ทุกบาทที่เก็บ คืออีกก้าวเล็ก ๆ ที่พาเราเข้าใกล้ความฝันนะ','ไม่ต้องรีบเก่งกว่าใคร แค่ค่อย ๆ ทำตามเป้าหมายของตัวเองก็เก่งมากแล้ว','เงินออมอาจเริ่มจากน้อย ๆ แต่ความตั้งใจของเรามีค่ามากเสมอ','วันนี้ทำได้เท่านี้ก็ยอดเยี่ยมแล้ว พรุ่งนี้ค่อยเริ่มใหม่ด้วยใจสบาย ๆ','อย่าลืมภูมิใจในตัวเองนะ เพราะทุกครั้งที่ออมคือการดูแลอนาคตของเรา','เป้าหมายใหญ่เริ่มจากก้าวเล็ก ๆ และมุกเชื่อว่าหนูทำได้','ความสม่ำเสมอสำคัญกว่าความเร็ว ค่อย ๆ เก็บไปทีละนิดนะคนเก่ง','ให้รางวัลตัวเองด้วยคำชมบ้างนะ วันนี้หนูพยายามได้ดีมากแล้ว','เงินทุกบาทที่ตั้งใจเก็บกำลังเล่าเรื่องความพยายามของหนูอยู่','ถ้าวันนี้ยังไม่ถึงเป้าไม่เป็นไร แค่ไม่หยุดเรียนรู้ก็เก่งแล้ว','เก็บเงินด้วยความสุข ไม่ต้องกดดันตัวเองนะ ค่อย ๆ ไปด้วยกัน','ความฝันไม่จำเป็นต้องสำเร็จในวันเดียว ทุกวันของหนูมีความหมาย'];const d=new Date();const index=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%messages.length;return messages[index]}
function cheer(amount){return `<div class="cheer-head"><div class="cheer-icon-box">${shapeIcon('heart','heart-mark')}</div><div><div class="cheer-title">ถึงนักออมคนเก่ง จากน้องมุก ${shapeIcon('flower','flower-mark')}</div><div class="cheer-subtitle">ข้อความให้กำลังใจประจำวัน</div></div></div><div class="cheer-divider"></div><div class="cheer-quote">“${esc(cheerText(amount))}”</div><div class="cheer-sign">— ด้วยกำลังใจจากน้องมุก ${shapeIcon('heart','heart-mark')}</div>`}
function recordRows(items,type){if(!items.length)return `<div class="empty">${shapeIcon('leaf')}<div>ยังไม่มีรายการในส่วนนี้</div></div>`;return `<div class="record-list">${items.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>{let amount=type==='sales'?num(x.qty)*num(x.price):type==='costs'&&x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):type==='withdrawal'?(num(x.withdrawalAmount)||Math.abs(num(x.amount))):num(x.amount);let icon=shapeIcon(type==='withdrawal'?'cash-out':type==='savings'?'pig':type==='sales'?'bag':'receipt');let editType=type==='sales'?'sale':type==='costs'?'cost':'saving',deleteKey=type==='sales'?'sales':type==='costs'?'costs':'savings';return `<div class="record"><div class="record-left"><div class="record-icon">${icon}</div><div><div class="record-name">${esc(x.name||x.note||'รายการ')}</div><div class="record-meta">${esc(x.date||'')} ${x.productId?'· '+esc(state.products?.find(p=>p.id===x.productId)?.name||'สินค้า'):''} ${x.goalId?'· '+esc(state.goals.find(g=>g.id===x.goalId)?.name||'เป้าหมายที่ถูกลบ'):''} ${x.note?'· '+esc(x.note):''}</div></div></div><div class="record-right"><div class="record-amount">${money(amount)}</div><div class="tiny-actions">${type==='withdrawal'?'':`<button onclick="formPage('${editType}','${x.id}')">แก้ไข</button>`}<button onclick="removeItem('${deleteKey}','${x.id}')">ลบ</button></div></div></div>`}).join('')}</div>`}
function dashboard(){let t=totals(),topGoals=state.goals.slice(0,2),recent=state.savings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3);return `${title(esc(state.settings.greeting||'สวัสดี 👋'),'',`<div class="head-actions"><button class="btn secondary" onclick="editGreeting()">✎ แก้ข้อความ</button><button class="btn" onclick="formPage('saving')">＋ บันทึกออม</button></div>`)}<div class="grid stats">${stat(`${shapeIcon('money')} เงินสะสม`,t.savings,'เงินออมที่บันทึกไว้','accent-text')}${stat(`${shapeIcon('pig')} ความคืบหน้าเป้าหมาย`,`${t.savingsPct.toFixed(1)}%`,'เทียบกับเป้าหมายรวม')}${stat(`${shapeIcon('bag')} ยอดขาย <small class="pct">${t.salesPct!==null?t.salesPct.toFixed(1)+'%':'—'}</small>`,t.sales,'เทียบต้นทุน = 100%','green')}${stat(`${t.profit<0?'ขาดทุน':t.profit>0?'กำไร':'เท่าทุน'} <small class="pct">${t.profitPct!==null?t.profitPct.toFixed(1)+'%':'—'}</small>`,t.profit,'ยอดขาย − ต้นทุน',t.profit<0?'red':'green')}</div><section class="card"><div class="section-head"><h3 class="inline-shape">${shapeIcon('target')} เป้าหมายที่กำลังออม</h3><button class="btn secondary" onclick="go('goals')">ดูทั้งหมด</button></div>${topGoals.length?`<div class="goal-list">${topGoals.map(g=>goalCard(g,true)).join('')}</div>`:'<div class="empty">เริ่มสร้างเป้าหมายออมเงินแรกของคุณ 🌱</div>'}<div class="form-actions"><button class="btn" onclick="formPage('goal')">＋ สร้างเป้าหมาย</button></div></section><section class="card cheer-card" style="margin-top:14px">${state.savings.length?cheer(t.savings):`<div class="cheer-head"><div class="cheer-icon-box">${shapeIcon('heart','heart-mark')}</div><div><div class="cheer-title">ถึงนักออมคนเก่ง จากน้องมุก ${shapeIcon('flower','flower-mark')}</div><div class="cheer-subtitle">ข้อความให้กำลังใจประจำวัน</div></div></div><div class="cheer-divider"></div><div class="cheer-quote">“ทุกการเริ่มต้นมีความหมาย ลองบันทึกเงินออมแรกของหนูดูนะ”</div><div class="cheer-sign">— ด้วยกำลังใจจากน้องมุก ${shapeIcon('heart','heart-mark')}</div function moveGoal(id,direction){const index=state.goals.findIndex(g=>g.id===id);if(index<0)return;const next=index+Number(direction);if(next<0||next>=state.goals.length){toast(next<0?'เป้าหมายนี้อยู่ลำดับแรกแล้ว':'เป้าหมายนี้อยู่ลำดับสุดท้ายแล้ว');return}const reordered=state.goals.slice();[reordered[index],reordered[next]]=[reordered[next],reordered[index]];state.goals=reordered;persist();go('goals');toast('เปลี่ยนลำดับเป้าหมายแล้ว 💗')}
function goalsPage(){let t=totals(),targetPct=t.goalTarget>0?100:0,savedPct=t.goalTarget>0?Math.min(100,t.goalSaved/t.goalTarget*100):0,leftPct=t.goalTarget>0?Math.max(0,100-savedPct):0;return `${title('ออมเงินและเป้าหมาย','ติดตามความคืบหน้า พร้อมคำแนะนำยอดออมเฉลี่ย',`<button class="btn" onclick="formPage('goal')">＋ เป้าหมายใหม่</button>`)}<div class="grid stats">${stat('เป้าหมาย',`${state.goals.length} รายการ`,'จำนวนเป้าหมาย')}${stat(`ยอดเป้าหมายรวม <small class="pct">${targetPct}%</small>`,t.goalTarget,'รวมทุกเป้าหมาย')}${stat(`ออมตามเป้าหมาย <small class="pct">${savedPct.toFixed(1)}%</small>`,t.goalSaved,'สัดส่วนที่ออมได้','green')}${stat(`ยังขาดอีก <small class="pct">${leftPct.toFixed(1)}%</small>`,Math.max(0,t.goalTarget-t.goalSaved),'สัดส่วนที่ยังต้องออม','red')}</div><section class="card"><h3 class="inline-shape">${shapeIcon('target')} เป้าหมายทั้งหมด</h3>${state.goals.length?`<div class="goal-list">${state.goals.map(g=>goalCard(g,false)).join('')}</div>`:'<div class="empty">ยังไม่มีเป้าหมาย กด “เป้าหมายใหม่” เพื่อเริ่มต้น 💗</div>'}</section><section class="card" style="margin-top:14px"><div class="section-head"><h3 class="inline-shape">${shapeIcon('target-arrow')} เป้าหมายที่สำเร็จแล้ว</h3><span class="muted">${state.completedGoals.length} เป้าหมาย</span></div>${completedGoalsSection()}</section><section class="card" style="margin-top:14px"><div class="section-head"><h3 class="inline-shape">${shapeIcon('clock')} ประวัติการออม</h3><span class="muted">${state.savings.length} รายการ</span></div><details class="goal-details"><summary>ดูประวัติการออม</summary><div class="muted" style="margin:8px 0">ยอดออมทั้งหมด ${money(state.savings.reduce((sum,x)=>sum+num(x.amount),0))}</div><b style="font-size:12px">สรุปรายสัปดาห์</b>${(()=>{const weekly={};state.savings.forEach(x=>{if(!x.date)return;const d=new Date(x.date+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));const k=d.toLocaleDateString('en-CA');weekly[k]=(weekly[k]||0)+num(x.amount)});return Object.keys(weekly).sort((a,b)=>b.localeCompare(a)).map(k=>`<div class="record-meta">สัปดาห์เริ่ม ${esc(k)} · ${money(weekly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายสัปดาห์</div>'})()}<b style="font-size:12px;display:block;margin-top:8px">สรุปรายเดือน</b>${(()=>{const monthly={};state.savings.forEach(x=>{if(!x.date)return;const k=x.date.slice(0,7);monthly[k]=(monthly[k]||0)+num(x.amount)});return Object.keys(monthly).sort((a,b)=>b.localeCompare(a)).map(k=>`<div class="record-meta">${esc(k)} · ${money(monthly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายเดือน</div>'})()}<b style="font-size:12px;display:block;margin-top:8px">รายการออมทั้งหมด</b>${state.savings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="record-meta" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0"><span>${esc(x.date||'-')} · ${esc(x.name||'ออมเงิน')} · ${money(x.amount)}</span><button class="product-chip-remove" onclick="removeItem('savings','${x.id}')">ลบ</button></div>`).join('')||'<div class="muted">ไม่มีประวัติรายการ</div>'}</details></section><section class="card" style="margin-top:14px"><div class="section-head"><h3 class="inline-shape">${shapeIcon('cash-out')} ประวัติการถอน</h3><span class="muted">${state.savings.filter(x=>num(x.amount)<0&&(x.type==='withdrawal'||String(x.name||'').startsWith('ถอนเงิน - '))).length} รายการ</span></div><details class="goal-details"><summary>ดูประวัติการถอน</summary>${(()=>{const withdrawals=state.savings.filter(x=>num(x.amount)<0&&(x.type==='withdrawal'||String(x.name||'').startsWith('ถอนเงิน - '))).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return withdrawals.length?withdrawals.map(x=>{const amount=num(x.withdrawalAmount)||Math.abs(num(x.amount));const remaining=x.remainingAfterWithdrawal!==undefined?num(x.remainingAfterWithdrawal):null;return `<div class="record-meta" style="display:flex;flex-direction:column;gap:4px;margin:9px 0;padding:10px;border:1px solid var(--line);border-radius:11px"><b>${esc(x.date||'-')} · ${esc(x.name||'ถอนเงิน')}</b><span>ถอนออก ${money(amount)}</span><span>ยอดออมคงเหลือหลังถอน ${remaining===null?'ข้อมูลเดิมไม่มีบันทึกยอดคงเหลือ':money(remaining)}</span></div>`}).join(''):'<div class="muted">ยังไม่มีประวัติการถอน</div>'})()}</details></section>`}

 const list=filtered.map(x=>({...x,_kind:x._type}));
 const grouped={costs:list.filter(x=>x._kind==='costs'),sales:list.filter(x=>x._kind==='sales'),savings:list.filter(x=>x._kind==='savings'),withdrawal:list.filter(x=>x._kind==='withdrawal')};

function changeSummaryListPeriod(v){
 const allowed=['day','week','month','year'];
 const next=allowed.includes(v)?v:'day';
 const current=String(window.summaryListDate||today());
 // Keep the selected calendar period, but normalize the stored date for the new control.
 if(next==='month') window.summaryListDate=/^\d{4}-\d{2}-\d{2}$/.test(current)?current.slice(0,7)+'-01':(/^\d{4}-\d{2}$/.test(current)?current+'-01':today().slice(0,7)+'-01');
 else if(next==='year') window.summaryListDate=/^\d{4}/.test(current)?current.slice(0,4)+'-01-01':today().slice(0,4)+'-01-01';
 else if(!/^\d{4}-\d{2}-\d{2}$/.test(current)) window.summaryListDate=today();
 window.summaryListPeriod=next;
 persistSummaryFilters();
 go('summary');
}
function changeSummaryListType(v){
 const allowed=['costs','sales','savings','withdrawal','all'];
 window.summaryListType=allowed.includes(v)?v:'all';
 persistSummaryFilters();
 go('summary');
}
function changeSummaryListDate(v,period){
 if(!v)return;
 if(period==='month')window.summaryListDate=/^\d{4}-\d{2}$/.test(v)?v+'-01':v;
 else if(period==='year')window.summaryListDate=/^\d{4}$/.test(v)?v+'-01-01':v;
 else window.summaryListDate=v;
 persistSummaryFilters();
 go('summary');
}

function addProduct(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());obj.name=(obj.name||'').trim();if(!obj.name){alert('กรุณากรอกชื่อสินค้า');return}if(!Array.isArray(state.products))state.products=[];const id=window.productEditingId||null;const form=e.target;const editingId=form.dataset.productId||null;if(state.products.some(p=>p.name.toLowerCase()===obj.name.toLowerCase()&&p.id!==editingId)){alert('มีสินค้านี้อยู่แล้ว');return}for(const k of ['price','costPrice','stock'])obj[k]=obj[k]===''?null:num(obj[k]);if(editingId){const i=state.products.findIndex(p=>p.id===editingId);if(i>=0)state.products[i]={...state.products[i],...obj,id:editingId};else state.products.push({...obj,id:editingId})}else state.products.push({...obj,id:crypto.randomUUID()});persist();go('sales');toast(editingId?'แก้ไขสินค้าแล้ว':'เพิ่มสินค้าแล้ว')}

function setSummaryPeriod(period,control){window.summaryPeriod=period;const picker=$('summaryPeriodSelect');if(picker&&picker.value!==period)picker.value=period;const wrap=$('summaryDateControls');const now=new Date();const todayKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const monthKey=todayKey.slice(0,7);let html='';if(period==='day')html=`<label>เลือกวันที่<input id="summaryDate" type="date" value="${todayKey}" onchange="updateSummaryChart()"></label>`;else if(period==='week')html=`<label>เลือกวันที่ในสัปดาห์<input id="summaryDate" type="date" value="${todayKey}" onchange="updateSummaryChart()"></label><span class="muted">เลือกวันอาทิตย์–วันเสาร์เพื่อดูกราฟทั้งสัปดาห์</span><div id="weekDateChoices" class="week-date-choices"></div>`;else if(period==='month')html=`<label>เลือกเดือน<input id="summaryDate" type="month" value="${monthKey}" onchange="updateSummaryChart()"></label>`;else html=`<label>เลือกปี<input id="summaryDate" type="number" min="2000" max="2100" value="${now.getFullYear()}" onchange="updateSummaryChart()"></label><span class="muted">แสดงตั้งแต่เดือนแรกที่มีข้อมูลจนถึงธันวาคม</span>`;wrap.innerHTML=html;updateSummaryChart()}
function updateSummaryChart(){const period=window.summaryPeriod||'day';const input=$('summaryDate');if(!input||!$('summaryChart'))return;const value=input.value;const chosen=document.querySelector('.summary-series input[name="summarySeries"]:checked')?.value||'all';const selected=chosen==='all'?['cost','sales','saving']:[chosen];const keys={cost:'ต้นทุน',sales:'ยอดขาย',saving:'เงินออม'};let items=[];const parseDate=s=>{const [y,m,d]=String(s||'').split('-').map(Number);return new Date(y,(m||1)-1,d||1)};if(period==='day'){const d=parseDate(value);items=[{date:value,label:d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}]}else if(period==='week'){const chosenDate=parseDate(value);const start=new Date(chosenDate);start.setDate(chosenDate.getDate()-chosenDate.getDay());for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);items.push({date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,label:['อา','จ','อ','พ','พฤ','ศ','ส'][i]+' '+d.getDate()})}}else if(period==='month'){const [y,m]=String(value||`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`).split('-').map(Number);for(let d=1;d<=new Date(y,m,0).getDate();d++)items.push({date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,label:String(d)})}else{const y=Number(value)||new Date().getFullYear();const allDates=[...state.sales,...state.costs,...state.savings].map(x=>x.date).filter(d=>d&&d.startsWith(String(y))).sort();for(let m=1;m<=12;m++)items.push({month:`${y}-${String(m).padStart(2,'0')}`,label:new Date(y,m-1,1).toLocaleDateString('th-TH',{month:'short'})})}if(period==='week'){const choices=$('weekDateChoices');if(choices){const anchor=parseDate(value);const sunday=new Date(anchor);sunday.setDate(anchor.getDate()-anchor.getDay());choices.innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(sunday);d.setDate(sunday.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<button type="button" class="${key===value?'selected':''}" onclick="chooseSummaryWeekDate('${key}')">${['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'][i]} ${d.getDate()}/${d.getMonth()+1}</button>`}).join('')}}
const total=(arr,kind,filter)=>arr.filter(x=>filter(x.date||'')).reduce((sum,x)=>sum+(kind==='sales'?num(x.qty)*num(x.price):kind==='cost'?(x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount)):num(x.amount)),0);items=items.map(it=>{const filter=period==='year'?d=>d&&d.startsWith(it.month):d=>d===it.date;return {...it,cost:total(state.costs,'cost',filter),sales:total(state.sales,'sales',filter),saving:total(state.savings,'saving',filter)}});const max=Math.max(1,...items.flatMap(x=>selected.map(k=>x[k]||0)));$('summaryChart').innerHTML=`<div class="multi-chart period-${period} ${selected.length===1?'single-series':'all-series'}" data-selected="${chosen}">${items.map(it=>`<div class="multi-group"><div class="multi-value">${selected.map(k=>(it[k]||0)>0?Math.round(it[k]).toLocaleString('th-TH'):'').filter(Boolean).join(' / ')}</div><div class="multi-bars">${selected.filter(k=>chosen==='all'||k===chosen).map(k=>`<div class="multi-bar ${k}" data-series="${k}" title="${keys[k]}: ${money(it[k]||0)}" style="height:${Math.max(2,(it[k]||0)/max*100)}%"></div>`).join('')}</div><div class="multi-label">${it.label}</div></div>`).join('')}</div>`}

function withdrawGoal(goalId){const goal=state.goals.find(g=>g.id===goalId);if(!goal)return;const available=goalAmount(goalId);if(available<=0){alert('เป้าหมายนี้ยังไม่มียอดเงินออมให้ถอน');return}const raw=prompt('ระบุจำนวนเงินที่ต้องการถอน (ยอดออมปัจจุบัน '+money(available)+')');if(raw===null)return;const amount=Number(String(raw).replace(/,/g,'').trim());if(!Number.isFinite(amount)||amount<=0){alert('กรุณาระบุจำนวนเงินที่ถูกต้อง');return}if(amount>available){alert('ยอดถอนต้องไม่เกินยอดออมปัจจุบัน '+money(available));return}const remaining=available-amount;state.savings.push({id:crypto.randomUUID(),name:'ถอนเงิน - '+goal.name,amount:-amount,date:today(),goalId:goalId,note:'ถอน '+money(amount)+' · คงเหลือ '+money(remaining),withdrawalAmount:amount,remainingAfterWithdrawal:remaining,type:'withdrawal'});persist();go('goals');toast('ถอนเงิน '+money(amount)+' · ยอดออมคงเหลือ '+money(remaining))}
