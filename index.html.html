const themes={
 pink:{label:'Sweet Pink',bg:'#fff7fb',card:'#ffffff',accent:'#df91b2',soft:'#fbe4ee',deep:'#a94e79'},

try{const savedSummary=JSON.parse(localStorage.getItem('amukz-summary-filters')||'null');if(savedSummary){window.summaryListPeriod=['day','week','month','year'].includes(savedSummary.period)?savedSummary.period:'day';window.summaryListType=['costs','sales','savings','withdrawal','all'].includes(savedSummary.type)?savedSummary.type:'all';if(typeof savedSummary.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(savedSummary.date))window.summaryListDate=savedSummary.date;window.summaryListView=savedSummary.view==='numbers'?'numbers':'list';window.summaryListProduct=typeof savedSummary.product==='string'?savedSummary.product:'all';}}catch(e){}

function copyFacebookLink(){const url='https://www.facebook.com/share/1BucWPzKeb/';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>toast('คัดลอกลิงก์ Facebook แล้ว 💗')).catch(()=>copyLinkFallback(url))}else copyLinkFallback(url)}
function copyLinkFallback(url){const el=document.createElement('textarea');el.value=url;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('คัดลอกลิงก์ Facebook แล้ว 💗')}catch(e){prompt('คัดลอกลิงก์นี้',url)}el.remove()}
function applyTheme(){let t=themes[state.settings.theme]||themes.pink;let r=document.documentElement.style;/* โหมดมืดยังคงโทนสีประจำธีม โดยแต้มสีธีมลงบนพื้นหลังและการ์ด */r.setProperty('--bg',darkMode?`color-mix(in srgb, ${t.bg} 13%, #17141b)`:t.bg);r.setProperty('--card',darkMode?`color-mix(in srgb, ${t.accent} 8%, #25212b)`:t.card);r.setProperty('--ink',darkMode?'#f5eff8':'#302a35');r.setProperty('--muted',darkMode?'#b9afc2':'#8b8290');r.setProperty('--line',darkMode?`color-mix(in srgb, ${t.accent} 22%, #403747)`:'#eee4ec');r.setProperty('--accent',t.accent);r.setProperty('--accent-soft',darkMode?`color-mix(in srgb, ${t.accent} 24%, #25212b)`:t.soft);r.setProperty('--accent-deep',darkMode?`color-mix(in srgb, ${t.accent} 58%, #ffffff)`:t.deep);document.documentElement.style.colorScheme=darkMode?'dark':'light';document.documentElement.classList.toggle('dark-mode',darkMode);const b=$('modeToggle');if(b){b.innerHTML=darkMode?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';b.title=darkMode?'เปลี่ยนเป็นโหมดสว่าง':'เปลี่ยนเป็นโหมดมืด';b.setAttribute('aria-label',b.title)}}
function toggleDarkMode(){darkMode=!darkMode;try{localStorage.setItem('amukz-dark-mode',String(darkMode))}catch(e){}applyTheme()}
function totals(){let savings=state.savings.reduce((a,x)=>a+num(x.amount),0), sales=state.sales.reduce((a,x)=>a+num(x.qty)*num(x.price),0), costs=state.costs.reduce((a,x)=>a+(x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount)),0)+(state.groceries||[]).reduce((a,x)=>a+num(x.qty)*num(x.price),0), goalTarget=state.goals.reduce((a,x)=>a+num(x.target),0),goalSaved=state.goals.reduce((a,g)=>a+goalAmount(g.id),0),profit=sales-costs;return{savings,sales,costs,profit,goalTarget,goalSaved,salesPct:costs>0?sales/costs*100:null,costPct:costs>0?100:null,profitPct:costs>0?profit/costs*100:null,savingsPct:goalTarget>0?Math.min(100,goalSaved/goalTarget*100):0}}
function goalAmount(id){return state.savings.filter(x=>x.goalId===id).reduce((a,x)=>a+num(x.amount),0)}
function freshState(){return {goals:[],completedGoals:[],savings:[],investments:[],sales:[],costs:[],plans:[],products:[],groceries:[],importedDocuments:[],groceryMode:'separate',settings:{theme:'pink',name:'พื้นที่การเงินของเรา',greeting:'สวัสดี 👋'}}}
function normalizeState(data={}){state={...freshState(),...data};state.settings={...freshState().settings,...(data.settings||{})};for(const k of ['goals','completedGoals','savings','investments','sales','costs','plans','products','groceries','importedDocuments'])if(!Array.isArray(state[k]))state[k]=[];}
function persist(){applyTheme();if(!firebaseReady||!user){toast('กรุณาเข้าสู่ระบบก่อนบันทึกข้อมูล');return}clearTimeout(syncTimer);const uid=user.uid;const snapshot=JSON.parse(JSON.stringify(state));pendingSync=pendingSync.then(async()=>{try{const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');if(!user||user.uid!==uid)return;await setDoc(doc(db,'users',uid,'app','data'),snapshot)}catch(e){console.error('Firestore save failed',e);toast('บันทึกออนไลน์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต')}})}
function stat(label,value,foot,cls=''){let shown=typeof value==='string'?esc(value):money(value);return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${shown}</div><div class="stat-foot">${foot||''}</div></div>`}
function title(h,p,action=''){const extra=p===''?' greeting-title':'';return `<div class="page-title${extra}"><div><h2>${h}</h2>${p?`<p>${p}</p>`:''}</div>${action}</div>`}
function savingsAdvice(g,saved){if(!g.deadline)return '<div class="muted">เพิ่มวันครบเป้าหมายเพื่อคำนวณยอดออมเฉลี่ย ✨</div>';let todayDate=new Date(today()+'T00:00:00'),end=new Date(g.deadline+'T00:00:00');let days=Math.max(0,Math.ceil((end-todayDate)/86400000)),left=Math.max(0,num(g.target)-saved);if(left<=0)return '<div class="cheer">🎉 เป้าหมายสำเร็จแล้ววว! เก่งที่สุดเลยยย 💖</div>';let bits=[`<span>วันละ <b>${money(left/Math.max(1,days))}</b></span>`];if(days>7)bits.push(`<span>สัปดาห์ละ <b>${money(left/Math.max(1,days/7))}</b></span>`);if(days>30)bits.push(`<span>เดือนละ <b>${money(left/Math.max(1,days/30.4375))}</b></span>`);if(days>365)bits.push(`<span>ปีละ <b>${money(left/Math.max(1,days/365.25))}</b></span>`);return `<div class="saving-advice">${bits.join('')}</div><div class="muted">เฉลี่ยจากยอดที่ยังขาด ${money(left)} · เหลือ ${days} วัน</div>`}
function goalCard(g,compact=false){let saved=goalAmount(g.id),pct=num(g.target)>0?Math.min(100,saved/num(g.target)*100):0,done=pct>=100;return `<div class="goal${compact?' compact-goal':''}"><div class="goal-head"><div class="goal-name">${esc(g.name)}</div><div class="goal-progress-info"><b>${pct.toFixed(1)}%</b><div class="goal-deadline">${g.deadline?'ครบกำหนด '+esc(g.deadline):'ยังไม่กำหนดวันครบกำหนด'}</div></div></div><div class="progress"><span style="width:${pct}%"></span></div><div class="goal-money-line"><span>เป้าหมาย <b>${money(g.target)}</b></span><span>ออมแล้ว <b>${money(saved)}</b></span><span>เหลือ <b>${money(Math.max(0,num(g.target)-saved))}</b></span></div>${!compact?`<details class="goal-details"><summary>ดูแผนออมเฉลี่ยและจัดการเป้าหมาย</summary>${savingsAdvice(g,saved)}<div class="tiny-actions goal-order-actions"><button type="button" aria-label="เลื่อนเป้าหมายขึ้น" title="เลื่อนขึ้น" onclick="moveGoal('${g.id}',-1)">▲</button><button type="button" aria-label="เลื่อนเป้าหมายลง" title="เลื่อนลง" onclick="moveGoal('${g.id}',1)">▼</button><button onclick="formPage('goal','${g.id}')">แก้ไข</button><button onclick="formPage('saving','', '${g.id}')">＋ เติมเงิน</button><button onclick="withdrawGoal('${g.id}')">ถอนเงิน</button><button onclick="removeItem('goals','${g.id}')">ลบ</button></div></details>`:''}${done?`<div class="form-actions"><button class="btn" onclick="completeGoal('${g.id}')">✓ ยืนยันเป้าหมายสำเร็จ</button></div>`:''}</div>`}
function completeGoal(id){const g=state.goals.find(x=>x.id===id);if(!g)return;const saved=goalAmount(id);if(saved<num(g.target)){toast('ยอดออมยังไม่ถึงเป้าหมาย');return}if(!confirm(`ยืนยันว่าเป้าหมาย “${g.name}” สำเร็จแล้วใช่ไหม?`))return;const records=state.savings.filter(x=>x.goalId===id).map(x=>({...x}));const weekly={},monthly={};records.forEach(x=>{const d=new Date((x.date||today())+'T00:00:00');const day=new Date(d);day.setDate(d.getDate()-((d.getDay()+6)%7));const wk=day.toLocaleDateString('en-CA');const mo=(x.date||today()).slice(0,7);weekly[wk]=(weekly[wk]||0)+num(x.amount);monthly[mo]=(monthly[mo]||0)+num(x.amount)});state.completedGoals.unshift({...g,completedAt:today(),completedAmount:saved,history:{records,weekly,monthly}});state.goals=state.goals.filter(x=>x.id!==id);persist();go('summary');toast('บันทึกเป้าหมายที่สำเร็จแล้ว 🎉')}
function completedGoalsSection(){if(!state.completedGoals.length)return '<div class="empty">ยังไม่มีเป้าหมายที่ยืนยันว่าสำเร็จ 🌷</div>';return `<div class="record-list">${state.completedGoals.slice().sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).map(g=>`<div class="completed-goal-card"><div class="record"><div class="record-left"><div class="record-icon">🏆</div><div><div class="record-name">${esc(g.name)}</div><div class="record-meta">สำเร็จวันที่ ${esc(g.completedAt||'-')} · ออมได้ ${money(g.completedAmount||g.target)}</div><details class="goal-details"><summary>รายละเอียดความสำเร็จและประวัติ</summary><div class="muted" style="margin:8px 0">ยอดเป้าหมาย ${money(g.target)} · สำเร็จ ${num(g.target)>0?Math.min(100,num(g.completedAmount||g.target)/num(g.target)*100).toFixed(1):100}%</div><b style="font-size:12px">สรุปรายสัปดาห์</b>${Object.keys(g.history?.weekly||{}).sort().map(k=>`<div class="record-meta">สัปดาห์เริ่ม ${esc(k)} · ${money(g.history.weekly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายสัปดาห์</div>'}<b style="font-size:12px;display:block;margin-top:8px">สรุปรายเดือน</b>${Object.keys(g.history?.monthly||{}).sort().map(k=>`<div class="record-meta">${esc(k)} · ${money(g.history.monthly[k])}</div>`).join('')||'<div class="muted">ไม่มีข้อมูลรายเดือน</div>'}<b style="font-size:12px;display:block;margin-top:8px">รายการออมที่ผ่านมา</b>${(g.history?.records||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="record-meta">${esc(x.date||'-')} · ${esc(x.name||'ออมเงิน')} · ${money(x.amount)}</div>`).join('')||'<div class="muted">ไม่มีประวัติรายการ</div>'}</details></div></div><div class="record-right"><span class="pct">สำเร็จ</span><div class="tiny-actions"><button class="danger" onclick="removeCompletedGoal('${g.id}')">ลบเป้าหมาย</button></div></div></div></div>`).join('')}</div>`}

function shapeIcon(name,cls='shape-icon'){const paths={house:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/>',money:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9h19M16.5 12h2M6 5V3.5h12V5"/><circle cx="11" cy="13" r="2.5"/>',pig:'<path d="M5 10 3.5 7l4 .5A9 9 0 0 1 12 6c4.4 0 7.5 2.6 7.5 6.3 0 1.3-.4 2.5-1.2 3.4l.5 3h-4l-.6-1.4H9.7L9 18.7H5.5l.4-3A6 6 0 0 1 4 12.5L2.5 12v-3z"/><path d="M19 10h2.5v4H19"/><circle cx="9" cy="10.5" r=".7"/><circle cx="15" cy="10.5" r=".7"/>',chart:'<path d="M3 3v18h18"/><rect x="6" y="12" width="3.5" height="6" rx=".5"/><rect x="11" y="8" width="3.5" height="10" rx=".5"/><rect x="16" y="4" width="3.5" height="14" rx=".5"/>',heart:'<path d="M20.8 8.8c0 5.1-8.8 11.2-8.8 11.2S3.2 13.9 3.2 8.8A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.5Z"/>',bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/>',spark:'<path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>', 'target-arrow':'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M21 3 12.5 11.5M15 3h6v6"/><path d="m18 6-5 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.8 1.8 0 0 1 1.4-3h1.4A3.5 3.5 0 0 0 21 11.2C21 6.7 17 3 12 3Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.8" r="1"/><circle cx="14.5" cy="7" r="1"/><circle cx="17" cy="10" r="1"/>',flower:'<path d="M12 12c-3-1-4-3.5-2.5-5.5C11 4.5 13 5 12 8c1-3 3-3.5 4.5-1.5C18 8.5 15 11 12 12Z"/><path d="M12 12c-3 1-5.5-.5-5.5-3S9 6 10.5 9"/><path d="M12 12c3 1 5.5-.5 5.5-3S15 6 13.5 9"/><path d="M12 12v9M12 17l-4-2M12 19l4-2"/>',leaf:'<path d="M20 4C10 4 4 8 4 15a5 5 0 0 0 5 5c7 0 11-6 11-1 function cheerText(amount){const messages=['ทุกบาทที่เก็บ คืออีกก้าวเล็ก ๆ ที่พาเราเข้าใกล้ความฝันนะ','ไม่ต้องรีบเก่งกว่าใคร แค่ค่อย ๆ ทำตามเป้าหมายของตัวเองก็เก่งมากแล้ว','เงินออมอาจเริ่มจากน้อย ๆ แต่ความตั้งใจของเรามีค่ามากเสมอ','วันนี้ทำได้เท่านี้ก็ยอดเยี่ยมแล้ว พรุ่งนี้ค่อยเริ่มใหม่ด้วยใจสบาย ๆ','อย่าลืมภูมิใจในตัวเองนะ เพราะทุกครั้งที่ออมคือการดูแลอนาคตของเรา','เป้าหมายใหญ่เริ่มจากก้าวเล็ก ๆ และมุกเชื่อว่าหนูทำได้','ความสม่ำเสมอสำคัญกว่าความเร็ว ค่อย ๆ เก็บไปทีละนิดนะคนเก่ง','ให้รางวัลตัวเองด้วยคำชมบ้างนะ วันนี้หนูพยายามได้ดีมากแล้ว','เงินทุกบาทที่ตั้งใจเก็บกำลังเล่าเรื่องความพยายามของหนูอยู่','ถ้าวันนี้ยังไม่ถึงเป้าไม่เป็นไร แค่ไม่หยุดเรียนรู้ก็เก่งแล้ว','เก็บเงินด้วยความสุข ไม่ต้องกดดันตัวเองนะ ค่อย ๆ ไปด้วยกัน','ความฝันไม่จำเป็นต้องสำเร็จในวันเดียว ทุกวันของหนูมีความหมาย'];const d=new Date();const index=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%messages.length;return messages[index]}

 const chart=`<section class="card" style="margin-top:14px"><div class="section-head"><h3>ภาพรวมตามช่วงเวลา</h3><span class="muted">${esc(periodLabel)}</span></div><div style="display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 12px">${chartTypes.map(t=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><i style="width:9px;height:9px;border-radius:3px;background:${chartColors[t]};display:inline-block"></i>${typeNames[t]}</span>`).join('')}</div><div style="display:flex;align-items:flex-end;gap:6px;overflow-x:auto;min-height:180px;padding:10px 2px 4px;border-bottom:1px solid var(--line)">${points.map(pt=>`<div style="flex:1 0 ${period==='month'?'24px':period==='year'?'34px':'30px'};display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px"><div style="height:130px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px">${chartTypes.map(t=>`<div title="${typeNames[t]} ${money(pt[t])}" style="width:${chartTypes.length===1?'min(25px,70%)':'min(12px,28%)'};height:${pt[t]>0?Math.max(3,pt[t]/maxValue*100):0}%;background:${chartColors[t]};border-radius:4px 4px 0 0"></div>`).join('')}</div><span style="font-size:10px;color:var(--muted);white-space:nowrap">${pt.label}</span></div>`).join('')}</div><div class="muted" style="font-size:11px;margin-top:8px">กราฟคำนวณจากรายการจริงตามช่วงเวลาและตัวกรองที่เลือก</div></section>`;
 let details='';
 if(view==='numbers'){
  const groups={};filtered.forEach(x=>{const g=period==='year'?(x.date||'').slice(0,7):period==='month'?(x.date||'').slice(0,10):(x.date||'ไม่ระบุวันที่');groups[g]??=[];groups[g].push(x)});
  const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  details=keys.length?`<div class="record-list">${keys.map(g=>{const arr=groups[g],a=sum(arr,'sales'),c=sum(arr,'costs'),s=sum(arr,'savings'),w=sum(arr,'withdrawal');return `<div class="record" style="display:block"><div class="section-head"><b>${esc(g)}</b><span class="muted">${arr.length} รายการ</span></div><div class="record-meta" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">${kind==='all'||kind==='sales'?`<span>ยอดขาย <b class="green">${money(a)}</b></span>`:''}${kind==='all'||kind==='costs'?`<span>ต้นทุน <b class="red">${money(c)}</b></span>`:''}${kind==='all'||kind==='sales'||kind==='costs'?`<span>กำไร/ขาดทุน <b>${money(a-c)}</b></span>`:''}${kind==='all'||kind==='savings'?`<span>ออม <b>${money(s)}</b></span>`:''}${kind==='all'||kind==='withdrawal'?`<span>ถอน <b>${money(w)}</b></span>`:''}</div></div>`}).join('')}</div>`:'<div class="empty">ไม่มีข้อมูลในช่วงเวลานี้</div>';
 }else{
  const groups={};filtered.forEach(x=>{const g=x.date||'ไม่ระบุวันที่';groups[g]??=[];groups[g].push(x)});
  const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  details=keys.length?keys.map(g=>`<div style="margin-bottom:12px"><div style="background:var(--accent-soft);color:var(--accent-deep);padding:9px 12px;border-radius:11px 11px 0 0;display:flex;justify-content:space-between;gap:8px"><b>${esc(g)}</b><span>${groups[g].length} รายการ</span></div>${types.map(t=>{const arr=groups[g].filter(x=>x._type===t);if(!arr.length)return '';return `<div style="border:1px solid var(--line);border-top:0;padding:8px 10px"><div class="muted" style="font-size:12px;margin-bottom:5px">${typeNames[t]}</div>${recordRows(arr,t)}</div>`}).join('')}</div>`).join(''):'<div class="empty">ไม่มีรายการในช่วงเวลานี้</div>';
 }
 const modeButtons=`<button type="button" class="btn ${view==='list'?'':'secondary'}" onclick="changeSummaryListView('list')">รายการ</button><button type="button" class="btn ${view==='numbers'?'':'secondary'}" onclick="changeSummaryListView('numbers')">ตัวเลข</button>`;
 return `${title('📊 สรุปบัญชี','ดูภาพรวมรายรับ รายจ่าย กำไร และเงินออมจากรายการที่บันทึกไว้')}<section class="card" style="margin-bottom:14px"><div style="display:flex;gap:7px;margin-bottom:16px">${tabs}</div><div class="field"><label>${period==='day'?'เลือกวันที่':period==='week'?'เลือกวันที่ในสัปดาห์':period==='month'?'เลือกเดือน / ปี':'เลือกปี'}</label>${dateControl}</div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px"><div class="field" style="margin:0"><label>เลือกสินค้า</label>${productSelect}</div><div class="field" style="margin:0"><label>โหมดข้อมูล</label>${typeSelect}</div></div><div style="display:flex;gap:8px;margin-top:12px">${modeButtons}</div></section><div class="grid stats">${stat('ยอดขาย',show('sales')?income:'—','รายรับจากการขาย','green')}${stat('ต้นทุน',show('costs')?expense:'—','ต้นทุนที่บันทึก','red')}${stat(balance>=0?'กำไร':'ขาดทุน',show('sales')||show('costs')?balance:'—','ยอดขาย − ต้นทุน',balance>=0?'green':'red')}${stat('ออมสุทธิ',show('savings')||show('withdrawal')?saved-withdrawn:'—','ออมเงิน − ถอนเงิน','accent-text')}</div>${chart}<section class="card" style="margin-top:14px"><div class="section-head"><h3>${view==='numbers'?'สรุปตัวเลขตามช่วงเวลา':'รายการบันทึก'}</h3><span class="muted">${filtered.length} รายการ · ${esc(periodLabel)}</span></div>${details}</section>`;
}
function changeSummaryListPeriod(v){
 const allowed=['day','week','month','year'];window.summaryListPeriod=allowed.includes(v)?v:'day';
 const current=String(window.summaryListDate||today());
 if(window.summaryListPeriod==='month')window.summaryListDate=/^\d{4}-\d{2}-\d{2}$/.test(current)?current.slice(0,7)+'-01':today().slice(0,7)+'-01';
 else if(window.summaryListPeriod==='year')window.summaryListDate=/^\d{4}/.test(current)?current.slice(0,4)+'-01-01':today().slice(0,4)+'-01-01';
 else if(!/^\d{4}-\d{2}-\d{2}$/.test(current))window.summaryListDate=today();
 persistSummaryFilters();go('summary');
}
function changeSummaryListType(v){window.summaryListType=['costs','sales','savings','withdrawal','all'].includes(v)?v:'all';persistSummaryFilters();go('summary')}
function changeSummaryListProduct(v){window.summaryListProduct=v||'all';persistSummaryFilters();go('summary')}
function changeSummaryListView(v){window.summaryListView=v==='numbers'?'numbers':'list';persistSummaryFilters();go('summary')}
function changeSummaryListDate(v,period){if(!v)return;if(period==='month')window.summaryListDate=/^\d{4}-\d{2}$/.test(v)?v+'-01':v;else if(period==='year')window.summaryListDate=/^\d{4}$/.test(v)?v+'-01-01':v;else window.summaryListDate=v;persistSummaryFilters();go('summary')}

function salesPage(){if(!Array.isArray(state.products))state.products=[];let activeProduct=window.salesProductFilter||'all';let activeRecordType=window.salesRecordTypeFilter||'all';let visibleSales=activeProduct==='all'?state.sales:activeProduct==='groceries'?[]:state.sales.filter(x=>x.productId===activeProduct);let visibleCosts=activeProduct==='all'?state.costs:activeProduct==='groceries'?[]:state.costs.filter(x=>x.productId===activeProduct);let shownSales=activeRecordType==='costs'?[]:visibleSales;let shownCosts=activeRecordType==='sales'?[]:visibleCosts;let salesTotal=visibleSales.reduce((sum,x)=>sum+num(x.qty)*num(x.price),0),costTotal=visibleCosts.reduce((sum,x)=>sum+(x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount)),0)+(activeProduct==='all'&&state.groceryMode==='combined'?(state.groceries||[]).reduce((a,x)=>a+num(x.qty)*num(x.price),0):0),profitTotal=salesTotal-costTotal;let t={sales:salesTotal,costs:costTotal,profit:profitTotal,salesPct:costTotal>0?salesTotal/costTotal*100:null,profitPct:costTotal>0?profitTotal/costTotal*100:null};let pct=t.profitPct!==null?Math.abs(t.profitPct).toFixed(1)+'%':'—',profitLabel=t.profit<0?'ขาดทุน':t.profit>0?'กำไร':'เท่าทุน',profitClass=t.profit<0?'red':'green';return `${title('ยอดขายและต้นทุน','ต้นทุนเป็นฐาน 100% เพื่อเทียบยอดขายและกำไร/ขาดทุน',`<div class="head-actions"><button class="btn secondary" onclick="formPage('cost')">＋ ต้นทุน</button><button class="btn" onclick="formPage('sale')">＋ ยอดขาย</button></div>`)}<div class="grid stats sales-page-stats"><div class="card"><div class="stat-label">ต้นทุนรวม</div><div class="stat-value">${money(t.costs)}</div><div class="stat-foot">กำหนดเป็นฐาน 100%</div></div><div class="card"><div class="stat-label">ยอดขายรวม</div><div class="stat-value green">${money(t.sales)}</div><div class="stat-foot">${t.salesPct!==null?t.salesPct.toFixed(1)+'%':'—'} ของต้นทุน</div></div><div class="card"><div class="stat-label">${profitLabel}</div><div class="stat-value ${profitClass}">${money(t.profit)}</div><div class="stat-foot">ยอดขาย − ต้นทุน</div></div><div class="card"><div class="stat-label">คิดเปอร์เซ็นต์</div><div class="stat-value ${profitClass}">${pct}</div><div class="stat-foot">${t.profit<0?'เปอร์เซ็นต์ขาดทุน':t.profit>0?'เปอร์เซ็นต์กำไร':'เท่าทุน'}</div></div></div><div class="sales-dual-panels"><section class="card"><div class="section-head"><h3 class="heading-tag">รายการสินค้า</h3><span class="muted">${state.products.length} รายการ</span></div><button class="btn secondary" style="margin-top:8px;width:100%" onclick="quickAddProduct()">＋ เพิ่มสินค้า</button><div class="product-strip" style="margin-top:12px;display:flex;flex-direction:column;align-items:stretch;white-space:normal;overflow:visible">${state.products.length?state.products.map(p=>`<div class="product-chip" style="max-width:none;justify-content:space-between"><span class="product-chip-name">${esc(p.name)}</span><button class="product-chip-remove" aria-label="ลบสินค้า ${esc(p.name)}" onclick="removeProduct('${p.id}')">ลบ</button></div>`).join(''):'<div class="empty">ยังไม่มีสินค้า</div>'}</div></section><section class="card"><div class="section-head"><h3 class="heading-tag">${state.groceryMode==='combined'?'อื่น ๆ · รวมของกินของใช้':'ซื้อของกินของใช้'}</h3><span class="muted">${(state.groceries||[]).length} รายการ</span></div><button class="btn secondary" style="margin-top:8px;width:100%" onclick="groceryFormPage()">＋ เพิ่มรายการซื้อ</button><div id="groceryCategories">${renderGroceryCategories()}</div><div id="groceryList">${renderGroceryItems()}</div><div class="grocery-total">${(state.groceries||[]).length} รายการ · รวมรายจ่าย ${money((state.groceries||[]).reduce((a,x)=>a+num(x.qty)*num(x.price),0))}</div></section></div><section class="grocery-mode"><b style="width:100%;font-size:12px">การแสดงรายการซื้อของกินของใช้</b><label><input type="radio" name="groceryMode" value="combined" ${state.groceryMode==='combined'?'checked':''} onchange="setGroceryMode(this.value)"> รวมกับอื่น ๆ</label><label><input type="radio" name="groceryMode" value="separate" ${state.groceryMode!=='combined'?'checked':''} onchange="setGroceryMode(this.value)"> แยกเฉพาะรายการซื้อของกินของใช้</label></section><section class="card" style="margin-top:14px"><div class="section-head"><h3 class="heading-tag">รายการบันทึก</h3><span class="muted">ขาย ${visibleSales.length} · ต้นทุน ${visibleCosts.length}</span></div><div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px"><div class="field" style="flex:1;min-width:180px;margin:0"><label>เลือกสินค้าเพื่อกรองรายการ</label><select onchange="filterSalesProduct(this.value)"><option value="all" ${activeProduct==='all'?'selected':''}>ทั้งหมด</option><option value="groceries" ${activeProduct==='groceries'?'selected':''}>ซื้อของกินของใช้</option>${state.products.map(p=>`<option value="${p.id}" ${activeProduct===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="flex:1;min-width:180px;margin:0"><label>เลือกประเภทรายการ</label><select onchange="filterSalesRecordType(this.value)">${activeProduct==='groceries'?`<option value="all">ทั้งหมด</option>${[...new Set((state.groceries||[]).map(x=>x.category||'ไม่ระบุหมวด'))].map(c=>`<option value="gcat:${esc(c)}" ${activeRecordType==='gcat:'+c?'selected':''}>${esc(c)}</option>`).join('')}${(state.groceries||[]).map(x=>`<option value="gitem:${x.id}" ${activeRecordType==='gitem:'+x.id?'selected':''}>${esc(x.name)}</option>`).join('')}`:`<option value="all" ${activeRecordType==='all'?'selected':''}>รายการขายและรายการต้นทุน</option><option value="sales" ${activeRecordType==='sales'?'selected':''}>รายการขาย</option><option value="costs" ${activeRecordType==='costs'?'selected':''}>รายการต้นทุน</option>`}</select></div></div><section class="product-record-section" style="${activeProduct==='groceries'||activeRecordType==='costs'?'display:none;':''}"><div class="section-head"><h4 class="heading-tag">${shapeIcon('bag')} รายการขาย</h4><div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap"><span class="muted">${shownSales.length} รายการ</span><strong style="white-space:nowrap">รวม ${money(shownSales.reduce((sum,x)=>sum+num(x.qty)*num(x.price),0))}</strong></div></div><div id="salesRecordPanel">${recordRows(shownSales,'sales')}</div></section><section class="product-record-section" style="margin-top:18px;${activeProduct==='groceries'||activeRecordType==='sales'?'display:none;':''}"><div class="section-head"><h4 class="heading-tag">${shapeIcon('receipt')} รายการต้นทุน</h4><div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap"><span class="muted">${shownCosts.length} รายการ</span><strong style="white-space:nowrap">รวม ${money(shownCosts.reduce((sum,x)=>sum+(x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount)),0))}</strong></div></div><div id="costsRecordPanel">${recordRows(shownCosts,'costs')}</div></section>${activeProduct==='groceries'?`<section class="product-record-section" style="margin-top:18px"><div class="section-head"><h4 class="heading-tag">รายการซื้อของกินของใช้</h4><strong>${money(groceryFiltered(activeRecordType).reduce((a,x)=>a+num(x.qty)*num(x.price),0))}</strong></div>${renderGroceryRecordRows(groceryFiltered(activeRecordType))}</section>`:''}</section>`}
function groceryFiltered(type){const items=state.groceries||[];if(type==='all')return items;if(type.startsWith('gcat:'))return items.filter(x=>(x.category||'ไม่ระบุหมวด')===type.slice(5));if(type.startsWith('gitem:'))return items.filter(x=>x.id===type.slice(6));return items}
function renderGroceryCategories(){const cats=[...new Set((state.groceries||[]).map(x=>x.category||'ไม่ระบุหมวด'))];if(!cats.length)return '';return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${cats.slice(0,2).map(c=>`<span class="product-chip">${esc(c==='food'?'ของกิน':c==='goods'?'ของใช้':c)}</span>`).join('')}${cats.length>2?`<details style="font-size:10px;color:var(--muted)"><summary>อีก ${cats.length-2} หมวด · ดูทั้งหมด</summary><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${cats.slice(2).map(c=>`<span class="product-chip">${esc(c==='food'?'ของกิน':c==='goods'?'ของใช้':c)}</span>`).join('')}</div></details>`:''}</div>`}
function renderGroceryRecordRows(items){if(!items.length)return '<div class="empty">ยังไม่มีรายการในหมวดนี้</div>';return `<div class="record-list">${items.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="record"><div><div class="record-name">${esc(x.name)}</div><div class="record-meta">${esc(x.category==='food'?'ของกิน':x.category==='goods'?'ของใช้':'ไม่ระบุหมวด')} · ${esc(x.date||'')} · ${num(x.qty)} × ${money(x.price)}</div></div><div class="record-right"><div class="record-amount">${money(num(x.qty)*num(x.price))}</div><div class="tiny-actions"><button onclick="groceryFormPage('${x.id}')">แก้ไข</button><button onclick="removeGroceryItem('${x.id}')">ลบ</button></div></div></div>`).join('')}</div>`}
function renderGroceryItems(){const items=Array.isArray(state.groceries)?state.groceries:[];if(!items.length)return '<div class="empty" style="padding:12px 2px">ยังไม่มีรายการซื้อ</div>';return items.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="grocery-row"><span><b>${esc(x.name)}</b><br><small class="muted">${esc(x.date||'')} · ${num(x.qty)} × ${money(x.price)} = <b>${money(num(x.qty)*num(x.price))}</b></small></span><span style="display:flex;gap:5px"><button class="product-chip-remove" onclick="groceryFormPage('${x.id}')">แก้ไข</button><button class="product-chip-remove" onclick="removeGroceryItem('${x.id}')">ลบ</button></span></div>`).join('')}
function groceryFormPage(id=''){const x=id?(state.groceries||[]).find(y=>y.id===id)||{}:{};$('main').innerHTML=`${title((id?'แก้ไข':'เพิ่ม')+'รายการซื้อของกินของใช้','บันทึกเป็นรายจ่าย พร้อมคำนวณยอดรวมอัตโนมัติ')}<section class="card"><form id="groceryForm"><div class="form-grid"><div class="field"><label>ชื่อรายการ *</label><input name="name" type="text" required placeholder="เช่น ข้าวสาร, น้ำดื่ม, สบู่" value="${esc(x.name||'')}"></div><div class="field"><label>จำนวน *</label><input name="qty" type="number" min="1" step="1" required value="${esc(x.qty??1)}"></div><div class="field"><label>ราคา (บาท) *</label><input name="price" type="number" min="0" step="0.01" required placeholder="ราคา/หน่วย" value="${esc(x.price??'')}"></div><div class="field"><label>หมวด *</label><select name="category" required><option value="food" ${x.category==='food'?'selected':''}>ของกิน</option><option value="goods" ${x.category==='goods'?'selected':''}>ของใช้</option></select></div><div class="field"><label>วันที่ *</label><input name="date" type="date" required value="${esc(x.date||today())}"></div></div><div class="form-actions"><button class="btn" type="submit">บันทึกรายจ่าย</button><button class="btn secondary" type="button" onclick="go('sales')">ยกเลิก</button></div></form></section>`;$('groceryForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());o.qty=Math.max(1,num(o.qty));o.price=num(o.price);o.category=o.category||'food';o.id=id||'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);if(!Array.isArray(state.groceries))state.groceries=[];if(id){const i=state.groceries.findIndex(y=>y.id===id);if(i>=0)state.groceries[i]=o;else state.groceries.push(o)}else state.groceries.push(o);persist();go('sales');toast('บันทึกรายจ่ายแล้ว 💗')}}
function addGroceryItem(){groceryFormPage()}
function removeGroceryItem(id){state.groceries=(state.groceries||[]).filter(x=>x.id!==id);persist();go('sales')}

r||'ไม่ระบุชื่อ')} · ${esc(new Date(d.importedAt||d.createdAt||Date.now()).toLocaleString('th-TH'))}</div></div><div class="form-actions"><button class="btn secondary" onclick="viewImportedDocument('${esc(d.id)}')">เปิดดู</button><button class="btn danger" onclick="deleteImportedDocument('${esc(d.id)}')">ลบ</button></div></div>`).join('')}</div>`:'<p class="muted">ยังไม่มีเอกสารที่ได้รับ</p>'}</section><section class="card" style="margin-top:14px"><h3>บัญชีและข้อมูล</h3><p class="muted">บัญชีที่เข้าสู่ระบบ: ${esc(user?.email||user?.displayName||'')}</p><p class="muted">ข้อมูลบันทึกออนไลน์แยกตามบัญชี และเปิดดูได้เมื่อเข้าสู่ระบบบัญชีเดิมจากอุปกรณ์อื่น</p><button class="btn danger" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button></section>`}

function formPage(type,id='',goalId=''){edit={type,id:id||null};let arrKey={goal:'goals',saving:'savings',sale:'sales',cost:'costs'}[type],x=id?state[arrKey].find(y=>y.id===id):{};x=x||{};let isGoal=type==='goal',isSaving=type==='saving',isSale=type==='sale',isCost=type==='cost';let heading=(id?'แก้ไข':'เพิ่ม')+({goal:'เป้าหมาย',saving:'เงินออม',sale:'ยอดขาย',cost:'ต้นทุน'}[type]||'รายการ');let fields='';
const input=(label,key,placeholder='',kind='text',value=x[key]??'',required=false)=>`<div class="field"><label>${label}${required?' *':''}</label><input name="${key}" type="${kind}" value="${esc(value)}" placeholder="${placeholder}" ${required?'required':''} ${kind==='number'?'step="0.01" min="0"':''}></div>`;
if(isGoal)fields=input('ชื่อเป้าหมาย','name','เช่น เก็บเงินซื้อแท็บเล็ต','text',x.name,true)+input('ยอดเงินเป้าหมาย (บาท)','target','10000','number',x.target,true)+input('วันครบเป้าหมาย','deadline','','date',x.deadline||'')+input('หมายเหตุ','note','รายละเอียดเพิ่มเติม','text',x.note||'');
if(isSaving)fields=input('รายการ / ที่มาของเงิน','name','เช่น ออมจากค่าขนม','text',x.name,true)+input('จำนวนเงิน (บาท)','amount','500','number',x.amount,true)+input('วันที่','date','','date',x.date||today())+`<div class="field"><label>เติมเข้าเป้าหมาย</label><select name="goalId"><option value="">ออมทั่วไป (ไม่ผูกเป้าหมาย)</option>${state.goals.map(g=>`<option value="${g.id}" ${(x.goalId||goalId)===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>`+input('หมายเหตุ','note','เพิ่มเติม','text',x.note||'');

if(isSale)fields=`<div class="field"><label>บันทึกไว้ในสินค้า *</label><select name="productId" required><option value="">เลือกสินค้า</option>${(state.products||[]).map(p=>`<option value="${p.id}" ${(x.productId||'')===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${!(state.products||[]).length?'<small class="muted">ไปที่หน้ายอดขายเพื่อเพิ่มรายการสินค้าก่อน</small>':''}</div>`+input('สินค้า / รายการขาย','name','เช่น เครป','text',x.name,true)+`<div class="field"><label>จำนวน</label><div class="stepper"><button type="button" onclick="stepQty(-1)">−</button><input id="qtyField" name="qty" type="number" min="1" step="1" value="${esc(x.qty??1)}" required><button type="button" onclick="stepQty(1)">＋</button></div></div>`+input('ราคาต่อหน่วย (บาท)','price','30','number',x.price,true)+input('วันที่','date','','date',x.date||today())+input('หมายเหตุ','note','ช่องทางขาย / ลูกค้า','text',x.note||'');
if(isCost)fields=`<div class="field"><label>บันทึกต้นทุนไว้ในสินค้า *</label><select name="productId" required><option value="">เลือกสินค้า</option>${(state.products||[]).map(p=>`<option value="${p.id}" ${(x.productId||'')===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${!(state.products||[]).length?'<small class="muted">ไปที่หน้ายอดขายเพื่อเพิ่มรายการสินค้าก่อน</small>':''}</div>`+input('ชื่อค่าใช้จ่าย / ต้นทุน','name','เช่น วัตถุดิบ','text',x.name,true)+`<div class="field"><label>จำนวน</label><div class="stepper"><button type="button" onclick="stepQty(-1)">−</button><input id="qtyField" name="qty" type="number" min="1" step="1" value="${esc(x.qty??1)}" required><button type="button" onclick="stepQty(1)">＋</button></div></div>`+input('ราคาต่อหน่วย / ต้นทุนต่อชิ้น (บาท)','price','150','number',x.price??x.amount,true)+input('วันที่','date','','date',x.date||today())+input('หมวดหมู่','category','เช่น วัตถุดิบ / ค่าเดินทาง','text',x.category||'')+input('หมายเหตุ','note','เพิ่มเติม','text',x.note||'');

$('main').innerHTML=`${title(heading,'กรอกข้อมูลให้ครบแล้วกดบันทึก')}<section class="card"><form id="dataForm"><div class="form-grid">${fields}</div><div class="form-actions"><button class="btn" type="submit">บันทึกข้อมูล</button><button class="btn secondary" type="button" onclick="go('${type==='goal'?'goals':type==='saving'?'goals':type==='sale'||type==='cost'?'sales':'dashboard'}')">ยกเลิก</button></div></form></section>`;
$('dataForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());for(let k of ['amount','target','qty','price'])if(obj[k]!==undefined&&obj[k]!=='')obj[k]=num(obj[k]);if(type==='cost'){obj.amount=num(obj.qty)*num(obj.price)}if(!obj.date&&['saving','sale','cost'].includes(type))obj.date=today();let key=arrKey;obj.id=id||(window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));if(id){let i=state[key].findIndex(y=>y.id===id);if(i>=0)state[key][i]=obj;else state[key].push(obj)}else state[key].push(obj);persist();go(type==='goal'||type==='saving'?'goals':type==='sale'||type==='cost'?'sales':'dashboard');toast(type==='saving'?cheerText(obj.amount):'บันทึกข้อมูลแล้ว 💗')};
}

function productFormPage(id=''){const p=id?(state.products||[]).find(x=>x.id===id)||{}:{};const field=(label,key,placeholder='',kind='text',required=false)=>`<div class="field"><label>${label}${required?' *':''}</label><input name="${key}" type="${kind}" value="${esc(p[key]??'')}" placeholder="${placeholder}" ${required?'required':''} ${kind==='number'?'min="0" step="0.01"':''}></div>`;$('main').innerHTML=`${title(id?'แก้ไขสินค้า':'เพิ่มสินค้า','กรอกรายละเอียดสินค้าเพื่อใช้แยกยอดขายและต้นทุน')}<section class="card"><form id="productForm" data-product-id="${id}"><div class="form-grid">${field('ชื่อสินค้า','name','เช่น เครป / กระเป๋าผ้า','text',true)}${field('รหัสสินค้า (ถ้ามี)','sku','เช่น SKU-001')}${field('หมวดหมู่','category','เช่น อาหาร / เสื้อผ้า')}${field('หน่วยนับ','unit','เช่น ชิ้น / กล่อง / แก้ว')}${field('ราคาขายต่อหน่วย (บาท)','price','เช่น 35','number')}${field('ต้นทุนต่อหน่วย (บาท)','costPrice','เช่น 18','number')}${field('จำนวนคงเหลือ (ถ้ามี)','stock','เช่น 20','number')}<div class="field"><label>รายละเอียด / หมายเหตุ</label><textarea name="note" rows="3" placeholder="เช่น ขนาด สี ตัวเลือก หรือรายละเอียดสินค้า">${esc(p.note||'')}</textarea></div></div><div class="form-actions"><button class="btn" type="submit">${id?'บันทึกการแก้ไข':'บันทึกสินค้า'}</button><button class="btn secondary" type="button" onclick="go('sales')">ยกเลิก</button></div></form></section>`;$('productForm').onsubmit=addProduct}
function editProduct(id){productFormPage(id)}
function addProduct(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());obj.name=(obj.name||'').trim();if(!obj.name){alert('กรุณากรอกชื่อสินค้า');return}if(!Array.isArray(state.products))state.products=[];const id=window.productEditingId||null;const form=e.target;const editingId=form.dataset.productId||null;if(state.products.some(p=>p.name.toLowerCase()===obj.name.toLowerCase()&&p.id!==editingId)){alert('มีสินค้านี้อยู่แล้ว');return}for(const k of ['price','costPrice','stock'])obj[k]=obj[k]===''?null:num(obj[k]);if(editingId){const i=state.products.findIndex(p=>p.id===editingId);if(i>=0)state.products[i]={...state.products[i],...obj,id:editingId};else state.products.push({...obj,id:editingId})}else state.products.push({...obj,id:(window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10))});persist();go('sales');toast(editingId?'แก้ไขสินค้าแล้ว':'เพิ่มสินค้าแล้ว')}
function removeProduct(id){if(state.sales.some(x=>x.productId===id)||state.costs.some(x=>x.productId===id)){if(!confirm('สินค้านี้มีรายการบันทึกอยู่ การลบสินค้าจะทำให้รายการเหล่านั้นยังอยู่ในทั้งหมด แต่ไม่สามารถกรองด้วยสินค้านี้ได้ ต้องการลบหรือไม่?'))return}else if(!confirm('ลบสินค้านี้ใช่ไหม?'))return;state.products=(state.products||[]).filter(p=>p.id!==id);persist();go('sales')}

function switchRecordTab(which){const salesPanel=$('salesRecordPanel'),costPanel=$('costsRecordPanel'),salesTab=$('tabSales'),costTab=$('tabCosts');if(!salesPanel||!costPanel||!salesTab||!costTab)return;let sales=which==='sales';salesPanel.classList.toggle('hidden',!sales);costPanel.classList.toggle('hidden',sales);salesTab.classList.toggle('selected',sales);costTab.classList.toggle('selected',!sales)}
function setSummaryPeriod(period,control){window.summaryPeriod=period;const picker=$('summaryPeriodSelect');if(picker&&picker.value!==period)picker.value=period;const wrap=$('summaryDateControls');const now=new Date();const todayKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const monthKey=todayKey.slice(0,7);let html='';if(period==='day')html=`<label>เลือกวันที่<input id="summaryDate" type="date" value="${todayKey}" onchange="updateSummaryChart()"></label>`;else if(period==='week')html=`<label>เลือกวันที่ในสัปดาห์<input id="summaryDate" type="date" value="${todayKey}" onchange="updateSummaryChart()"></label><span class="muted">เลือกวันอาทิตย์–วันเสาร์เพื่อดูกราฟทั้งสัปดาห์</span><div id="weekDateChoices" class="week-date-choices"></div>`;else if(period==='month')html=`<label>เลือกเดือน<input id="summaryDate" type="month" value="${monthKey}" onchange="updateSummaryChart()"></label>`;else html=`<label>เลือกปี<input id="summaryDate" type="number" min="2000" max="2100" value="${now.getFullYear()}" onchange="updateSummaryChart()"></label><span class="muted">แสดงตั้งแต่เดือนแรกที่มีข้อมูลจนถึงธันวาคม</span>`;wrap.innerHTML=html;updateSummaryChart()}
function updateSummaryChart(){const period=window.summaryPeriod||'day';const input=$('summaryDate');if(!input||!$('summaryChart'))return;const value=input.value;const chosen=document.querySelector('.summary-series input[name="summarySeries"]:checked')?.value||'all';const selected=chosen==='all'?['cost','sales','saving']:[chosen];const keys={cost:'ต้นทุน',sales:'ยอดขาย',saving:'เงินออม'};let items=[];const parseDate=s=>{const [y,m,d]=String(s||'').split('-').map(Number);return new Date(y,(m||1)-1,d||1)};if(period==='day'){const d=parseDate(value);items=[{date:value,label:d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}]}else if(period==='week'){const chosenDate=parseDate(value);const start=new Date(chosenDate);start.setDate(chosenDate.getDate()-chosenDate.getDay());for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);items.push({date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,label:['อา','จ','อ','พ','พฤ','ศ','ส'][i]+' '+d.getDate()})}}else if(period==='month'){const [y,m]=String(value||`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`).split('-').map(Number);for(let d=1;d<=new Date(y,m,0).getDate();d++)items.push({date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,label:String(d)})}else{const y=Number(value)||new Date().getFullYear();const allDates=[...state.sales,...state.costs,...state.savings].map(x=>x.date).filter(d=>d&&d.startsWith(String(y))).sort();for(let m=1;m<=12;m++)items.push({month:`${y}-${String(m).padStart(2,'0')}`,label:new Date(y,m-1,1).toLocaleDateString('th-TH',{month:'short'})})}if(period==='week'){const choices=$('weekDateChoices');if(choices){const anchor=parseDate(value);const sunday=new Date(anchor);sunday.setDate(anchor.getDate()-anchor.getDay());choices.innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(sunday);d.setDate(sunday.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<button type="button" class="${key===value?'selected':''}" onclick="chooseSummaryWeekDate('${key}')">${['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'][i]} ${d.getDate()}/${d.getMonth()+1}</button>`}).join('')}}
const total=(arr,kind,filter)=>arr.filter(x=>filter(x.date||'')).reduce((sum,x)=>sum+(kind==='sales'?num(x.qty)*num(x.price):kind==='cost'?(x.qty!=null&&x.price!=null?num(x.qty)*num(x.price):num(x.amount)):num(x.amount)),0);items=items.map(it=>{const filter=period==='year'?d=>d&&d.startsWith(it.month):d=>d===it.date;return {...it,cost:total(state.costs,'cost',filter),sales:total(state.sales,'sales',filter),saving:total(state.savings,'saving',filter)}});const max=Math.max(1,...items.flatMap(x=>selected.map(k=>x[k]||0)));$('summaryChart').innerHTML=`<div class="multi-chart period-${period} ${selected.length===1?'single-series':'all-series'}" data-selected="${chosen}">${items.map(it=>`<div class="multi-group"><div class="multi-value">${selected.map(k=>(it[k]||0)>0?Math.round(it[k]).toLocaleString('th-TH'):'').filter(Boolean).join(' / ')}</div><div class="multi-bars">${selected.filter(k=>chosen==='all'||k===chosen).map(k=>`<div class="multi-bar ${k}" data-series="${k}" title="${keys[k]}: ${money(it[k]||0)}" style="height:${Math.max(2,(it[k]||0)/max*100)}%"></div>`).join('')}</div><div class="multi-label">${it.label}</div></div>`).join('')}</div>`}
function chooseSummaryWeekDate(date){const input=$('summaryDate');if(input){input.value=date;updateSummaryChart()}}

function importData(e){

  const x=JSON.parse(reader.result);if(!x||x.format!=='A-MUKZ-POCKET-SHARE'||x.version!==1||!x.data||typeof x.data!=='object'||!x.documentId)throw new Error('not-amukz');

function applyImportedData(x,data,mode){
 const keys=['goals','completedGoals','savings','investments','sales','costs','plans','products','groceries'];
 const archive=Array.isArray(state.importedDocuments)?state.importedDocuments:[];
 if(mode==='copy'){
  keys.forEach(k=>{const incoming=Array.isArray(data[k])?JSON.parse(JSON.stringify(data[k])):[];state[k]=[...(Array.isArray(state[k])?state[k]:[]),...incoming]});
  if(data.groceryMode)state.groceryMode=data.groceryMode;
 }else{
  const next=freshState();keys.forEach(k=>next[k]=Array.isArray(data[k])?JSON.parse(JSON.stringify(data[k])):[]);
  next.groceryMode=data.groceryMode||'separate';next.settings={...next.settings,...(data.settings||{}),theme:state.settings?.theme||data.settings?.theme||'pink'};
  next.importedDocuments=archive;state=next;
 }
 const docId=x.documentId; if(!archive.some(d=>d.documentId===docId))archive.unshift({id:'doc-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),documentId:docId,name:String(x.name||'เอกสารที่นำเข้า').slice(0,120),owner:String(x.owner||'ไม่ระบุชื่อ').slice(0,120),createdAt:x.createdAt||new Date().toISOString(),importedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data)),importMode:mode});
 state.importedDocuments=archive;persist();go('settings');toast(mode==='copy'?'คัดลอกข้อมูลจากเอกสารเข้าระบบแล้ว':'แทนที่ข้อมูลด้วยเอกสารเรียบร้อยแล้ว')
}

function authError(e){const code=e?.code||'';const messages={'auth/email-already-in-use':'อีเมลนี้มีบัญชีอยู่แล้ว กรุณาเข้าสู่ระบบ','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง','auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีนี้ กรุณาสมัครสมาชิกก่อน','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร','auth/popup-closed-by-user':'ปิดหน้าต่างเข้าสู่ระบบ Google ก่อนดำเนินการเสร็จ','auth/popup-blocked':'เบราว์เซอร์บล็อกหน้าต่าง Google กรุณาอนุญาตป๊อปอัป','auth/unauthorized-domain':'โดเมนเว็บไซต์ยังไม่ได้เพิ่มใน Firebase Authentication > Settings > Authorized domains','auth/network-request-failed':'เชื่อมต่ออินเทอร์เน็ตไม่ได้ กรุณาลองใหม่','auth/operation-not-allowed':'ยังไม่ได้เปิดวิธีเข้าสู่ระบบนี้ใน Firebase Console','auth/invalid-api-key':'Firebase API key ไม่ถูกต้อง กรุณาตรวจสอบ firebaseConfig','auth/app-not-authorized':'แอปนี้ยังไม่ได้รับอนุญาตให้ใช้ Firebase Authentication','auth/configuration-not-found':'ยังไม่ได้ตั้งค่า Firebase Authentication ในโปรเจกต์','auth/too-many-requests':'ลองเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่'};return messages[code]||('ดำเนินการไม่สำเร็จ ('+code+'). กรุณาตรวจสอบการตั้งค่า Firebase แล้วลองใหม่')}
async function submitAuth(){const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<6){alert('กรอกอีเมลให้ถูกต้องและรหัสผ่านอย่างน้อย 6 ตัวอักษร');return}if(!firebaseReady||!auth){alert('เชื่อมต่อ Firebase ไม่สำเร็จ จึงยังไม่สามารถเข้าสู่ระบบจริงได้ กรุณาตรวจสอบการตั้งค่าและอินเทอร์เน็ต');return}try{const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');if(authMode==='signup')await m.createUserWithEmailAndPassword(auth,email,password);else await m.signInWithEmailAndPassword(auth,email,password)}catch(e){alert(authError(e))}}
async function signInWithGoogle(){if(!firebaseReady||!auth){alert('เชื่อมต่อ Firebase ไม่สำเร็จ กรุณาตรวจสอบการตั้งค่าและอินเทอร์เน็ต');return}try{const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');const provider=new m.GoogleAuthProvider();await m.signInWithPopup(auth,provider)}catch(e){alert(authError(e))}}
async function resetPassword(){const email=$('authEmail').value.trim();if(!email){alert('กรอกอีเมลในช่องอีเมลก่อน แล้วกดลืมรหัสผ่านอีกครั้ง');return}if(!firebaseReady||!auth){alert('เชื่อมต่อ Firebase ไม่สำเร็จ กรุณาตรวจสอบการตั้งค่า');return}try{const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');await m.sendPasswordResetEmail(auth,email);alert('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว กรุณาตรวจสอบกล่องจดหมาย')}catch(e){alert(authError(e))}}
function showApp(){$('authView').classList.add('hidden');$('appView').classList.remove('hidden');applyTheme();go(page)}
async function logout(){try{clearTimeout(syncTimer);await pendingSync;if(firebaseReady&&auth&&auth.currentUser){const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');await m.signOut(auth)}if(unsub){unsub();unsub=null}user=null;normalizeState(freshState());$('appView').classList.add('hidden');$('authView').classList.remove('hidden');$('authPassword').value='';$('authTitle').textContent='ยินดีต้อนรับ 💗';$('authSubtitle').textContent='เข้าสู่ระบบเพื่อดูข้อมูลที่บันทึกไว้';authMode='login';$('authSubmit').textContent='เข้าสู่ระบบ';$('authPrompt').textContent='ยังไม่มีบัญชี?';$('authSwitch').textContent='สมัครสมาชิก'}catch(e){alert(authError(e))}}

normalizeState(freshState());
{
 try{
  const appMod=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const authMod=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const fs=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const app=appMod.initializeApp(firebaseConfig);auth=authMod.getAuth(app);db=fs.getFirestore(app);firebaseReady=true;
  authMod.onAuthStateChanged(authMod.getAuth(app),async u=>{if(unsub){unsub();unsub=null}user=u;if(!u){normalizeState(freshState());$('appView').classList.add('hidden');$('authView').classList.remove('hidden');return}normalizeState(freshState());const ref=fs.doc(db,'users',u.uid,'app','data');let firstSnapshot=true;unsub=fs.onSnapshot(ref,s=>{if(s.exists()){normalizeState(s.data());applyTheme();showApp()}else if(firstSnapshot){normalizeState(freshState());persist();showApp()}firstSnapshot=false},e=>{console.error('Firestore read failed',e);alert('อ่านข้อมูลจากคลาวด์ไม่ได้ กรุณาตรวจสอบ Firestore Rules และอินเทอร์เน็ต')})});
 }catch(e){firebaseReady=false;console.error('Firebase initialization failed:',e);$('authSubtitle').textContent='เชื่อมต่อ Firebase ไม่สำเร็จ ('+(e?.code||e?.message||'unknown error')+') กรุณาตรวจสอบอินเทอร์เน็ตและการตั้งค่า Firebase แล้วโหลดหน้าใหม่';$('authFootnote').textContent='หากยังเข้าไม่ได้ ให้ตรวจสอบ Firebase Authentication > Sign-in method และ Authorized domains'}
}
